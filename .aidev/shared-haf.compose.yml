# The shared HAF service (`sandbox.shared.haf` in project.yaml): one PostgreSQL
# per served HAF version, database only, holding that version's 5M replay as a
# frozen template and handing every test run its own copy-on-write clone of it
# (.aidev/shared-haf/, see .aidev/README.md).
#
# Hosted by a dedicated AIDEV session on a host whose HAF_SHARED_DATA_ROOT is a
# ZFS dataset with block cloning (steem-13); start.sh refuses anything else.
# The port is published on every interface: consumers reach it through relays
# on other hosts.
#
# A second version is a second service of this shape — its own fixture commit
# and digest, its own port name in project.yaml — over the same data root.

services:
  haf:
    image: "registry.gitlab.syncad.com/hive/haf/fixture-5m:${HAF_FIXTURE_COMMIT:?}@${HAF_FIXTURE_DIGEST:?}"
    environment:
      HAF_FIXTURE_COMMIT: "${HAF_FIXTURE_COMMIT:?}"
      HAF_SHARED_ROOT: /haf-shared
      HAF_SHARED_RUN_TTL: "${HAF_SHARED_RUN_TTL:-6 hours}"
      # Over TCP only the consumer role, only to the clone API and its own
      # clones, with a password; the image's trust rule is replaced.
      PG_ACCESS: 'host haf_shared haf_shared_consumer 0.0.0.0/0 scram-sha-256\nhost haf_shared haf_shared_consumer ::/0 scram-sha-256\nhost /^run_[a-z0-9_-]+$$ haf_shared_consumer 0.0.0.0/0 scram-sha-256\nhost /^run_[a-z0-9_-]+$$ haf_shared_consumer ::/0 scram-sha-256'
    ports:
      - "0.0.0.0:${AIDEV_PORT_PG:?}:5432"
    volumes:
      - type: bind
        source: "${HAF_SHARED_DATA_ROOT:?}"
        target: /haf-shared
      - type: bind
        source: ./shared-haf
        target: /aidev/shared-haf
        read_only: true
    entrypoint: ["/aidev/shared-haf/start.sh"]
    command: []
    stop_grace_period: 2m
    healthcheck:
      test: ["CMD-SHELL", "sudo -nu postgres psql -X -d haf_shared -Atc \"select haf_commit || ' head block ' || head_block from haf_shared.health()\" | grep -q 'head block'"]
      interval: 15s
      timeout: 10s
      retries: 3
      # The first start of a version copies its cluster onto the dataset.
      start_period: 30m
