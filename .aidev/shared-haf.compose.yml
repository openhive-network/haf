# The shared HAF service (`sandbox.shared.haf` in project.yaml): one PostgreSQL
# per served HAF version, database only, holding that version's 5M replay as a
# frozen template and handing every test run its own copy-on-write clone of it
# (.aidev/shared-haf/, see .aidev/README.md).
#
# Hosted by a dedicated AIDEV session on a host whose HAF_SHARED_DATA_ROOT is a
# ZFS dataset with block cloning (steem-13); seed.sh refuses anything else.
# The port is published on every interface: consumers reach it through relays
# on other hosts.
#
# Both services run the plain HAF image of the served version, pinned by digest
# (HAF_IMAGE), and HAF_VERSION, its 40-hex HAF commit, names the version's
# directory in the data root. seed.sh builds that directory once by a local 5M
# replay of the data root's block_log_5m/block_log.
#
# A second version is a second service of this shape — its own image and
# version, its own port name in project.yaml — over the same data root.

x-shared-haf: &shared-haf
  image: "${HAF_IMAGE:?HAF_IMAGE must name the HAF image as <repository>:<tag>@sha256:<digest>}"
  environment: &shared-haf-env
    HAF_VERSION: "${HAF_VERSION:?HAF_VERSION must name the full HAF commit of HAF_IMAGE}"
    HAF_SHARED_ROOT: /haf-shared

# Compose runs in the session worker, but the host's daemon resolves bind
# sources on the host: a relative path would name a worker-side directory.
x-data-root: &data-root
  type: bind
  source: "${HAF_SHARED_DATA_ROOT:?}"
  target: /haf-shared
x-scripts: &scripts
  type: bind
  source: "${AIDEV_HOST_CHECKOUT:?AIDEV_HOST_CHECKOUT must name the checkout as the docker daemon sees it}/.aidev/shared-haf"
  target: /aidev/shared-haf
  read_only: true

services:
  # Replays the version's 5M cluster onto the dataset on the first start of a
  # version; a no-op afterwards.
  seed:
    <<: *shared-haf
    environment:
      <<: *shared-haf-env
      # The replay's PostgreSQL trusts no network client.
      PG_ACCESS: ""
    volumes:
      - *data-root
      - *scripts
      # The configuration CI's prepare_haf_data replays with.
      - type: bind
        source: "${AIDEV_HOST_CHECKOUT:?}/docker/config_5M.ini"
        target: /aidev/config_5M.ini
        read_only: true
    entrypoint: ["/aidev/shared-haf/seed.sh"]
    command: []
    restart: "no"

  haf:
    <<: *shared-haf
    depends_on:
      seed:
        condition: service_completed_successfully
    environment:
      <<: *shared-haf-env
      HAF_SHARED_RUN_TTL: "${HAF_SHARED_RUN_TTL:-6 hours}"
      # Over TCP only the consumer role, only to the clone API and its own
      # clones, and only from fleet addresses, without a password: the data is
      # public chain data. Every range gets the same two rules, in this order:
      #   192.168.3.0/24  Jefferson site LAN
      #   192.168.5.0/24  site LAN
      #   192.168.6.0/24  PL site LAN
      #   172.16.0.0/12   docker: the provider host itself, whose connections
      #                   arrive through docker's NAT
      #   100.64.0.0/10   the inter-site VPN, which carries only fleet traffic
      #                   between the site gateways (192.168.6.6 at PL,
      #                   192.168.3.4 at Jefferson); a host at another site
      #                   arrives with a source address in it
      # The hivemind shared service (hive/hivemind,
      # .aidev/shared-hivemind.compose.yml) keeps a copy of this list; change
      # both together. The image's trust rule is replaced.
      PG_ACCESS: 'host haf_shared haf_shared_consumer 192.168.3.0/24 trust\nhost /^run_[a-z0-9_-]+$$ haf_shared_consumer 192.168.3.0/24 trust\nhost haf_shared haf_shared_consumer 192.168.5.0/24 trust\nhost /^run_[a-z0-9_-]+$$ haf_shared_consumer 192.168.5.0/24 trust\nhost haf_shared haf_shared_consumer 192.168.6.0/24 trust\nhost /^run_[a-z0-9_-]+$$ haf_shared_consumer 192.168.6.0/24 trust\nhost haf_shared haf_shared_consumer 172.16.0.0/12 trust\nhost /^run_[a-z0-9_-]+$$ haf_shared_consumer 172.16.0.0/12 trust\nhost haf_shared haf_shared_consumer 100.64.0.0/10 trust\nhost /^run_[a-z0-9_-]+$$ haf_shared_consumer 100.64.0.0/10 trust'
    ports:
      - "0.0.0.0:${AIDEV_PORT_PG:?}:5432"
    volumes:
      - *data-root
      - *scripts
      # The version's cluster, mounted at the very path the image's
      # postgresql.conf names, beside which its relative tablespace link
      # resolves: a symlink there makes setup_postgres.sh see the tablespace at
      # a different location and abort. Compose creates this
      # container before seed runs, and the daemon refuses a missing source
      # unless allowed to create it; seed.sh removes such an empty directory
      # before seeding.
      - type: bind
        source: "${HAF_SHARED_DATA_ROOT:?}/${HAF_VERSION:?}/haf_db_store"
        target: /home/hived/datadir/haf_db_store
        bind:
          create_host_path: true
    entrypoint: ["/aidev/shared-haf/start.sh"]
    command: []
    stop_grace_period: 2m
    healthcheck:
      test: ["CMD-SHELL", "sudo -nu postgres psql -X -d haf_shared -Atc \"select haf_commit || ' head block ' || head_block from haf_shared.health()\" | grep -q 'head block'"]
      interval: 15s
      timeout: 10s
      retries: 3
      # The first start of a version freezes its template; its replay runs
      # before, in `seed`.
      start_period: 30m
