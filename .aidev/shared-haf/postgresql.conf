# The shared HAF service's additions to the image's postgresql.conf
# (installed into haf_postgresql_conf.d by start.sh).

# CREATE DATABASE … STRATEGY FILE_COPY clones the template's files
# (copy_file_range) instead of copying them: on ZFS with block cloning a run's
# database shares every block with the template until it is written.
file_copy_method = clone

# A client that vanishes without closing its connection (a dead host, a dropped
# network path) leaves its backend waiting forever; one waiting inside COPY
# FROM STDIN also stalls every DROP DATABASE in the cluster, as it never
# absorbs the drop's ProcSignalBarrier. Keepalives (and, for unacknowledged
# sends, the user timeout) end such a backend within a minute of silence.
# client_connection_check_interval covers only a client lost while a query runs.
tcp_keepalives_idle = 30
tcp_keepalives_interval = 10
tcp_keepalives_count = 3
tcp_user_timeout = 60000
client_connection_check_interval = 10s
