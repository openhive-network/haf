# Profile for hive/haf, written by `aidev project scaffold` (#13561).
#
# Schema reference: docs/architecture/project-profile.md
# Onboarding procedure: the `onboard-external-project` skill.
# Guide: docs/operations/onboarding-an-external-project.md
#
# The generator writes a starting point, not a governed answer: every
# binding below is the command a maintainer said this project runs, and it
# is reviewed and edited like any other declaration.
version: 2
project: haf

gitlab:
  host: "gitlab.syncad.com"
  path: "hive/haf"
  id: 323

# AIDEV integrates into its own branch; people merge it into develop through
# merge requests (as in hive/HAfAH and hive/haf_api_node), so `stable` is
# omitted and `aidev release` never moves develop or master.
branches:
  integration: "aidev/integration"
  # Integration reaches develop only by merge request gated by the project CI (aidev handoff).
  handoff: develop

# How this project's suites execute (#13892): one kind, stated once.
environment:
  kind: "container"
  # The HAF image itself with its entrypoint cleared: built by
  # .aidev/runtime/build.sh from .aidev/runtime/Dockerfile (its only input).
  image: "registry.gitlab.syncad.com/hive/haf/aidev-tests@sha256:7fbd227a73fa8b180389312f9f8e80d7497b3513b50bc4bc9ac7c69ce343771b"
  inputs: [".aidev/runtime/Dockerfile"]
  # Run each tree in the CI image built from its own native sources. A tree whose
  # newest source commit has no CI image (CI runs no pipeline for ai/, session/ or
  # aidev/integration pushes) runs in the image `build` makes from its checkout:
  # the pinned image above (BASE_IMAGE) with libhfm and libquery_supervisor
  # compiled from the candidate. See .aidev/README.md.
  source_image:
    repository: "registry.gitlab.syncad.com/hive/haf"
    # Must match scripts/ci-helpers/source-patterns.sh (CI's rebuild patterns).
    paths: ["src/", "hive/", "cmake/", "CMakeLists.txt", "Dockerfile", "Dockerfile.sql-overlay",
            "docker/", "scripts/haf/", "scripts/maintenance-scripts/", "scripts/setup_ubuntu.sh",
            "scripts/generate_extension_sql.sh", "common_includes/", ".gitmodules"]
    # The suites install these themselves, so they need no new image.
    exclude: ["*.sql", "*.md"]
    # Reads only the paths above from the checkout; a cold build takes ~3 minutes.
    build:
      dockerfile: ".aidev/runtime/Dockerfile.source"

issues:
  intake_label: todo
  taxonomy: ".aidev/labels.yaml"
  decompose:
    # `never` is where an external project starts: nothing marks work
    # approved on this project's behalf until there is a track record.
    auto_todo: never
  # Reports about this project's work are filed against this project.
  watcher_reports: self

# Verification slots. Each binding is what this project genuinely runs for
# that slot — never one selection repeated under seven names, which makes
# seven gates report on the same evidence while claiming to check seven
# different things.
#
# SQL path first: the candidate's hive_fork_manager SQL is installed into the
# test image (as CI's Dockerfile.sql-overlay does) and the SQL functional
# tests ctest registers run against it (.aidev/hfm-functional.sh). The image's
# libhfm and libquery_supervisor are built from the tree's own sources
# (environment.source_image); hived is the pinned base's, so `cxx-scope` reports a
# candidate's other C++/CMake/hive changes as a skipped case. `full` also runs the
# HAF system tests a change selects (below). Unbound for now: the C++ build and
# unit tests, replay, forking and the rest of the system tests (CI keeps them), and `static`
# (scripts/ has shellcheck errors today) and `system`, which AIDEV runs for no
# project. See .aidev/README.md.
#
# The functional tests' failures are reported under their own ids
# (hfm-functional::<folder>/<test>; the step's own case then reads skipped), so
# `.aidev/known_failures.txt` can pardon them (honor_quarantine) and aidev's
# flake layers re-run them through `run-checks.sh ... --rerun <id>...`. Any other
# failing case (a step that crashed, hfm/libhfm-symbols) has no rerun rule and
# blocks. No `files:` template: the ids name no file, so repeat-new-tests has
# nothing to narrow to.
verification:
  quick:
    adapter: command
    args: [".aidev/run-checks.sh", "quick", "hfm-smoke", "cxx-scope"]
    artifacts: ["test-results/quick/"]
    honor_quarantine: true
    rerun: &hfm_rerun
      classify: true
      match: "^hfm-functional::(hive_fork_manager|query_supervisor)/"
      file_pattern: "^hfm-functional$"
      ids: ["--rerun", "{ids}"]
  # `full` adds the HAF system tests a change to hived's side of HAF selects, in
  # their own testnet image (.aidev/run-haf-system.sh); for any other change that
  # suite reports skipped by its `select`. Its ids are
  # haf-system::<module>.py::<test>, re-run by node id. A slot with several suites
  # takes pass-through arguments only with `--suite`. See .aidev/README.md.
  full:
    suites:
      - name: hfm_functional
        adapter: command
        args: [".aidev/run-checks.sh", "full", "hfm-functional", "cxx-scope"]
        artifacts: ["test-results/full/"]
        honor_quarantine: true
        rerun: *hfm_rerun
      - name: haf_system
        adapter: command
        args: [".aidev/run-haf-system.sh"]
        # The testnet HAF image of develop a5f9302d7 (its hived has #433's fix) with
        # the haf-local-tools venv: .aidev/runtime/build.sh --system --push.
        image: "registry.gitlab.syncad.com/hive/haf/aidev-system-tests@sha256:a7594b26090434b25a15f49afb15179e308de4f51ee8720e57b653abb3c69278"
        select: [".aidev/haf-system-select.sh"]
        # Its container has no network and no docker, so the host copies the
        # candidate's testnet libhfm out of the tree's source image into
        # test-results/testnet-libhfm/ first; a no-op once hfm_functional left it.
        prepare: [".aidev/fetch-candidate-libhfm.sh"]
        artifacts: ["test-results/haf-system/"]
        timeout: 1800
        honor_quarantine: true
        rerun:
          classify: true
          match: "^haf-system::"
          file_pattern: "^haf-system$"
          ids: ["--rerun", "{ids}"]
  baseline:
    adapter: command
    args: [".aidev/run-checks.sh", "baseline", "hfm-functional"]
    artifacts: ["test-results/baseline/"]
    honor_quarantine: true
    rerun: *hfm_rerun
  canary:
    adapter: command
    args: [".aidev/run-checks.sh", "canary", "hfm-functional", "cxx-scope"]
    artifacts: ["test-results/canary/"]
    honor_quarantine: true
    rerun: *hfm_rerun
  # No coverage measurement for SQL; AIDEV runs `coverage` only in the
  # post-implementation scan.
  coverage:
    adapter: command
    args: [".aidev/run-checks.sh", "coverage", "hfm-smoke"]
    artifacts: ["test-results/coverage/"]

# The shared HAF service (#353): a dedicated session on steem-13 (ZFS with
# block cloning) runs it, and other projects' suites reach it as
# `sandbox.external: [{name: haf, provider: "haf/haf"}]`, each run cloning the
# replayed 5M database. See .aidev/README.md.
sandbox:
  shared:
    haf:
      compose: ".aidev/shared-haf.compose.yml"
      services: [haf]
      ports: [pg]
      # The first start of a version replays 5M blocks onto the dataset (CI's
      # prepare_haf_data allows 80 minutes; on session24.pl the seed took about
      # 6) and freezes its template. 1800 seconds is AIDEV's ceiling; a slower
      # host seeds a version by hand first (README).
      readiness_timeout: 1800
      env:
        # The HAF image of develop pipeline 183480, pinned by digest, and its
        # full HAF commit, which names the version's directory in the data root.
        HAF_IMAGE: "registry.gitlab.syncad.com/hive/haf:17c8606f@sha256:0b9366e37b7674fba7f4ccb01d2fcdf44737aff23d60d3720c1a9e5edaf818e3"
        HAF_VERSION: "17c8606f2c78ae6c5783e1189d59031be2b43fbe"
        HAF_SHARED_DATA_ROOT: "/haf-pool/aidev-shared-haf"

capabilities: []
