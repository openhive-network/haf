# Profile for hive/haf, written by `aidev project scaffold` (#13561).
#
# Schema reference: docs/architecture/project-profile.md
# Onboarding procedure: the `onboard-external-project` skill.
# Guide: docs/operations/onboarding-an-external-project.md
#
# The generator writes a starting point, not a governed answer: every
# binding below is the command a maintainer said this project runs, and it
# is reviewed and edited like any other declaration.
version: 2
project: haf

gitlab:
  host: "gitlab.syncad.com"
  path: "hive/haf"
  id: 323

# AIDEV integrates into its own branch; people merge it into develop through
# merge requests (as in hive/HAfAH and hive/haf_api_node), so `stable` is
# omitted and `aidev release` never moves develop or master.
branches:
  integration: "aidev/integration"

# How this project's suites execute (#13892): one kind, stated once.
environment:
  kind: "container"
  # The HAF image itself with its entrypoint cleared: built by
  # .aidev/runtime/build.sh from .aidev/runtime/Dockerfile (its only input).
  image: "registry.gitlab.syncad.com/hive/haf/aidev-tests@sha256:42ea3e76c1b50341263bdc869baa9f498ce8fdca42eaf3a19345d0125add9cf8"
  inputs: [".aidev/runtime/Dockerfile"]

issues:
  intake_label: todo
  taxonomy: ".aidev/labels.yaml"
  decompose:
    # `never` is where an external project starts: nothing marks work
    # approved on this project's behalf until there is a track record.
    auto_todo: never
  # Reports about this project's work are filed against this project.
  watcher_reports: self

# Verification slots. Each binding is what this project genuinely runs for
# that slot — never one selection repeated under seven names, which makes
# seven gates report on the same evidence while claiming to check seven
# different things.
#
# SQL path first: the candidate's hive_fork_manager SQL is installed into the
# pinned HAF image (as CI's Dockerfile.sql-overlay does) and the SQL functional
# tests ctest registers run against it (.aidev/hfm-functional.sh). The image's
# C++ (libhfm, hived) is the base commit's, so `cxx-scope` reports a candidate's
# C++/CMake/hive changes as a skipped, unverified case. Unbound for now: the C++
# build and unit tests, replay and system tests (CI keeps them), and `static`
# (scripts/ has shellcheck errors today) and `system`, which AIDEV runs for no
# project. See .aidev/README.md.
verification:
  quick:
    adapter: command
    args: [".aidev/run-checks.sh", "quick", "hfm-smoke", "cxx-scope"]
    artifacts: ["test-results/quick/"]
  full:
    adapter: command
    args: [".aidev/run-checks.sh", "full", "hfm-functional", "cxx-scope"]
    artifacts: ["test-results/full/"]
  baseline:
    adapter: command
    args: [".aidev/run-checks.sh", "baseline", "hfm-functional"]
    artifacts: ["test-results/baseline/"]
  canary:
    adapter: command
    args: [".aidev/run-checks.sh", "canary", "hfm-functional", "cxx-scope"]
    artifacts: ["test-results/canary/"]
  # No coverage measurement for SQL; AIDEV runs `coverage` only in the
  # post-implementation scan.
  coverage:
    adapter: command
    args: [".aidev/run-checks.sh", "coverage", "hfm-smoke"]
    artifacts: ["test-results/coverage/"]

# The shared HAF service (#353): a dedicated session on steem-13 (ZFS with
# block cloning) runs it, and other projects' suites reach it as
# `sandbox.external: [{name: haf, provider: "haf/haf"}]`, each run cloning the
# replayed 5M database. See .aidev/README.md.
sandbox:
  shared:
    haf:
      compose: ".aidev/shared-haf.compose.yml"
      services: [haf]
      ports: [pg]
      # The first start of a version copies its replayed cluster onto the dataset.
      readiness_timeout: 1800
      env:
        # Fixture image hive/haf/fixture-5m:<commit> (CI's build_haf_fixture_image).
        HAF_FIXTURE_COMMIT: "e2237bea170e6aea9fc327fb1b1e34b5237d219d"
        HAF_FIXTURE_DIGEST: "sha256:6f0d0f435b829b47379b80dbba8f2602d8ce558cedd941d1cb1b427985c8c020"
        HAF_SHARED_DATA_ROOT: "/haf-pool/aidev-shared-haf"

capabilities: []
