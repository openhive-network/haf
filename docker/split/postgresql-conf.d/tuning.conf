# Performance tuning defaults for HAF.
# These are conservative defaults safe for any environment.
# For production, override via custom.conf.d (bind-mounted from db/conf.d/).

shared_buffers = 128MB
effective_cache_size = 256MB
maintenance_work_mem = 64MB
work_mem = 4MB

checkpoint_completion_target = 0.9

random_page_cost = 1.01
effective_io_concurrency = 200

# Set to 4 to build indexes faster
max_parallel_maintenance_workers = 4

# Autovacuum tuning
autovacuum_max_workers = 5
autovacuum_vacuum_cost_limit = 5000

# Worker processes (needed for pg_cron background workers)
max_worker_processes = 16
