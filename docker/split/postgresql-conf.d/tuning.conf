# Performance tuning for HAF workload
# These are defaults; override via /etc/postgresql/haf_api_node_conf.d/ volume mount

shared_buffers = 16GB
effective_cache_size = 16GB
maintenance_work_mem = 4GB
work_mem = 64MB

checkpoint_completion_target = 0.9
checkpoint_timeout = 60min

wal_buffers = 512MB
random_page_cost = 1.01
effective_io_concurrency = 200

# Set to 4 to build indexes faster
max_parallel_maintenance_workers = 4

# Autovacuum tuning
autovacuum_max_workers = 5
autovacuum_vacuum_cost_limit = 5000

# Worker processes (needed for pg_cron background workers)
max_worker_processes = 16
