# CI-specific PostgreSQL configuration overrides
# These settings reduce memory usage to allow multiple concurrent HAF jobs
# on builders with limited RAM (e.g., 64GB machines running 4+ jobs)
#
# Production systems should NOT use this config - use the defaults or
# doc/haf_postgresql_conf.d/custom_postgres.conf instead

# Memory settings - reduced for CI concurrency
# Default: 16GB - reduced to 4GB per instance
shared_buffers = 4GB

# Default: 16GB - reduced to 8GB
effective_cache_size = 8GB

# Default: 4GB - reduced to 1GB
maintenance_work_mem = 1GB

# Default: 512MB - reduced to 128MB
wal_buffers = 128MB

# work_mem intentionally left at default (64MB) - it stacks with connections
# and reducing it can cause sort/hash operations to spill to disk

# Default: 100 - increased to support more parallel test workers
max_connections = 400

# WAL size - reduced for smaller CI cache footprint
max_wal_size = 2GB              # Default: 8GB - more frequent checkpoints
min_wal_size = 256MB            # Default: 1GB - allows WAL to shrink smaller
checkpoint_timeout = 15min      # Default: 60min - forces checkpoints sooner
