# =============================================================================
# HAF Data Preparation Job Templates
# =============================================================================
# This file provides HAF-specific job templates by including from common-ci
# and adding HAF-specific configuration.
#
# Templates available after including this file:
#   From common-ci-configuration:
#     - .haf_docker_image_builder_job
#     - .prepare_haf_image (base)
#     - .prepare_haf_data_5m (base)
#     - .wait-for-haf-postgres
#     - .wait-for-haf-postgres-with-nfs-extraction
#
#   From hive (via docker_image_jobs.gitlab-ci.yml):
#     - .docker_image_builder_job_template
#     - .docker_image_cleanup_job_template
# =============================================================================

include:
  # All templates from common-ci-configuration
  - project: 'hive/common-ci-configuration'
    ref: feature/upstream-git-cleanup-templates  # TODO: Change to develop after common-ci-configuration!191 is merged
    file:
      - '/templates/base.gitlab-ci.yml'
      - '/templates/docker_image_jobs.gitlab-ci.yml'
      - '/templates/haf_data_preparation.gitlab-ci.yml'
      - '/templates/haf_app_testing.gitlab-ci.yml'
      - '/templates/cache_cleanup.gitlab-ci.yml'
      - '/templates/python_projects.gitlab-ci.yml'
      - '/templates/test_jobs.gitlab-ci.yml'
  # Local CI image tag variables
  - local: '/scripts/ci-helpers/ci_image_tag_vars.yml'

# =============================================================================
# Base docker builder job for HAF
# =============================================================================
# Extends the common-ci template with HAF-specific setup.
# Other HAF CI jobs should extend this.
.docker_image_builder_job:
  extends: .docker_image_builder_job_template
  variables:
    FF_NETWORK_PER_BUILD: "true"
  before_script:
    - !reference [.docker_image_builder_job_template, before_script]
    - git config --global --add safe.directory '*'

.docker_image_cleanup_job:
  extends: .docker_image_cleanup_job_template
