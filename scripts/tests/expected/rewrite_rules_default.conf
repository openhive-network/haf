# default endpoint for everything else
rewrite ^/(.*)$ /rpc/$1 break;

# endpoint for openapi spec itself
rewrite ^/$ / break;

# endpoint for get /test-api/accounts
rewrite ^/test-api/accounts /rpc/get_accounts break;

# endpoint for get /test-api/accounts/{account_name}
rewrite ^/test-api/accounts/([^/]+) /rpc/get_account_by_name?account_name=$1 break;

# endpoint for get /test-api/accounts/{account_name}/tokens/{token_id}
rewrite ^/test-api/accounts/([^/]+)/tokens/([^/]+) /rpc/get_account_token?account_name=$1&token_id=$2 break;

# endpoint for get /test-api/operations
rewrite ^/test-api/operations /rpc/get_operations?path-filter=$path_filters break;

# endpoint for get /test-api/internal/debug (internal)
rewrite ^/test-api/internal/debug /rpc/internal_debug break;

# endpoint for get /test-api/balances
rewrite ^/test-api/balances /rpc/get_balances break;

