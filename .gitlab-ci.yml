# Test pipeline: SSH to localhost for cache copy operations
# This tests whether we can use SSH to bypass Docker overhead for file operations

stages:
  - test

variables:
  GIT_STRATEGY: clone

test_ssh_localhost_copy:
  stage: test
  image: registry.gitlab.syncad.com/hive/common-ci-configuration/docker-builder:409108966606eba9e8f270c76dfb929cae65dba3
  tags:
    - data-cache-storage
  services:
    - name: registry.gitlab.syncad.com/hive/common-ci-configuration/docker-dind:409108966606eba9e8f270c76dfb929cae65dba3
      alias: docker
      variables:
        DOCKER_TLS_CERTDIR: "/certs"
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_VERIFY: 1
    DOCKER_CERT_PATH: /certs/client
  script:
    - |
      echo "=== Test 1: Check environment ==="
      echo "Hostname inside container: $(hostname)"
      echo "Running as user: $(whoami) ($(id))"

      # Check if we're in a container
      if [[ -f /.dockerenv ]]; then
        echo "Running inside Docker container: YES"
      else
        echo "Running inside Docker container: NO"
      fi

      # Check mounts
      echo ""
      echo "=== Mount points ==="
      mount | grep -E "/cache|/nfs" || echo "No /cache or /nfs mounts found in mount output"
      df -h /cache /nfs/ci-cache 2>/dev/null || echo "df failed"

    - |
      echo ""
      echo "=== Test 2: Create test data inside container ==="
      TEST_DIR="/cache/ssh_test_$$"
      mkdir -p "$TEST_DIR"

      # Create ~100MB of test data (mix of sizes)
      echo "Creating test data in $TEST_DIR..."
      dd if=/dev/urandom of="$TEST_DIR/large_file" bs=1M count=50 2>/dev/null
      mkdir -p "$TEST_DIR/small_files"
      for i in $(seq 1 100); do
        dd if=/dev/urandom of="$TEST_DIR/small_files/file_$i" bs=1K count=10 2>/dev/null
      done

      echo "Test data created:"
      du -sh "$TEST_DIR"
      find "$TEST_DIR" -type f | wc -l
      echo " files"

    - |
      echo ""
      echo "=== Test 3: Copy INSIDE container (baseline) ==="
      TEST_DIR="/cache/ssh_test_$$"
      DEST_CONTAINER="/cache/ssh_test_container_copy_$$"

      echo "Copying $TEST_DIR -> $DEST_CONTAINER (inside container)..."
      time cp -a "$TEST_DIR" "$DEST_CONTAINER"
      echo "Container copy complete"
      rm -rf "$DEST_CONTAINER"

    - |
      echo ""
      echo "=== Test 4: Check SSH availability ==="

      # Check if ssh client is available
      which ssh && ssh -V || echo "SSH client not found"

      # Try to determine the host IP
      # In Docker, the host is usually accessible via the default gateway
      HOST_IP=$(ip route | grep default | awk '{print $3}')
      echo "Default gateway (potential host): $HOST_IP"

      # Alternative: try docker host
      echo "DOCKER_HOST: $DOCKER_HOST"

      # Check if we can reach the host
      ping -c 1 "$HOST_IP" 2>/dev/null && echo "Host is reachable" || echo "Cannot ping host"

    - |
      echo ""
      echo "=== Test 5: Try SSH to localhost/host ==="
      TEST_DIR="/cache/ssh_test_$$"
      DEST_SSH="/cache/ssh_test_ssh_copy_$$"
      HOST_IP=$(ip route | grep default | awk '{print $3}')

      # Try various SSH approaches
      echo "Attempting SSH connections..."

      # Method 1: SSH to gateway IP (might be host)
      echo "Method 1: SSH to $HOST_IP..."
      if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 "$HOST_IP" "echo 'SSH to host works!'" 2>/dev/null; then
        echo "SUCCESS: SSH to $HOST_IP works"
        echo "Testing copy via SSH..."
        time ssh -o StrictHostKeyChecking=no "$HOST_IP" "cp -a '$TEST_DIR' '$DEST_SSH'"
        echo "SSH copy complete"
        ssh -o StrictHostKeyChecking=no "$HOST_IP" "rm -rf '$DEST_SSH'"
      else
        echo "FAILED: Cannot SSH to $HOST_IP"
      fi

      # Method 2: Try hostname-based approach
      echo ""
      echo "Method 2: Check for host SSH via known builder hostnames..."
      for host in hive-builder-8 hive-builder-9 hive-builder-10; do
        if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=2 "$host" "hostname" 2>/dev/null; then
          echo "SUCCESS: Can SSH to $host"
          echo "Testing copy via SSH to $host..."
          time ssh -o StrictHostKeyChecking=no "$host" "cp -a '$TEST_DIR' '$DEST_SSH' && rm -rf '$DEST_SSH'"
          break
        fi
      done

    - |
      echo ""
      echo "=== Test 6: Try NFS copy comparison ==="
      TEST_DIR="/cache/ssh_test_$$"
      DEST_NFS="/nfs/ci-cache/ssh_test_$$"

      if [[ -d /nfs/ci-cache ]]; then
        echo "Copying $TEST_DIR -> $DEST_NFS (to NFS, inside container)..."
        time cp -a "$TEST_DIR" "$DEST_NFS"
        echo "NFS copy complete"
        rm -rf "$DEST_NFS"
      else
        echo "NFS not available"
      fi

    - |
      echo ""
      echo "=== Cleanup ==="
      TEST_DIR="/cache/ssh_test_$$"
      rm -rf "$TEST_DIR"
      rm -rf "/cache/ssh_test_*" 2>/dev/null || true
      echo "Cleanup complete"

  timeout: 10m
