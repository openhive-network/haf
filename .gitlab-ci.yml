stages:
  - build_and_test_phase_1
  - build_and_test_phase_2

variables:
  HAF_COMMIT: "9ce4243d23b6f27ab9023a401ada586a856b8848"
  DATA_CACHE_HAF_PREFIX: "/cache/replay_data_haf"
  PIPELINE_CACHE_TYPE: "haf_pipeline"
  PIPELINE_CACHE_KEY: "${CI_PIPELINE_ID}"
  PIPELINE_DATA_CACHE_LOCAL: "/cache/haf_pipeline_${CI_PIPELINE_ID}"
  GIT_STRATEGY: clone
  GIT_SUBMODULE_STRATEGY: recursive

include:
  - local: '/scripts/ci-helpers/prepare_data_image_job.yml'

.job-defaults:
  retry:
    max: 0

.fetch_pipeline_cache: &fetch_pipeline_cache
  - |
    echo -e "\e[0Ksection_start:$(date +%s):copy_data[collapsed=true]\r\e[0KFetching pipeline data via cache-manager..."
    set -e
    CACHE_MANAGER="$CI_PROJECT_DIR/scripts/ci-helpers/cache-manager.sh"
    echo "Fetching cache: type=${PIPELINE_CACHE_TYPE} key=${PIPELINE_CACHE_KEY}"
    echo "Destination: ${PIPELINE_DATA_CACHE_LOCAL}"
    if "$CACHE_MANAGER" get "${PIPELINE_CACHE_TYPE}" "${PIPELINE_CACHE_KEY}" "${PIPELINE_DATA_CACHE_LOCAL}"; then
      echo "Pipeline data fetch complete."
    else
      echo "ERROR: Failed to fetch pipeline cache"
      exit 1
    fi
    ls -la "${PIPELINE_DATA_CACHE_LOCAL}/datadir" || true
    echo -e "\e[0Ksection_end:$(date +%s):copy_data\r\e[0K"

# Minimal prepare_haf_data - uses existing cache
prepare_haf_data:
  extends: .prepare_haf_data_5m
  stage: build_and_test_phase_1
  
replay_data_copy:
  extends: .job-defaults
  image: "registry.gitlab.syncad.com/hive/haf/ci-base-image:ubuntu24.04-10"
  stage: build_and_test_phase_1
  needs:
    - prepare_haf_data
  variables:
    SCRIPTS_PATH: "$CI_PROJECT_DIR/scripts"
  script:
    - |
      set -e
      CACHE_MANAGER="$SCRIPTS_PATH/ci-helpers/cache-manager.sh"
      SOURCE_CACHE="${DATA_CACHE_HAF_PREFIX}_${HAF_COMMIT}"
      echo "Creating pipeline cache via cache-manager"
      if [[ -d "$SOURCE_CACHE" ]]; then
        echo "Using local cache: $SOURCE_CACHE"
        DATA_SOURCE="$SOURCE_CACHE"
      else
        echo "Local cache not found, fetching from NFS..."
        LOCAL_CACHE="/cache/haf_${HAF_COMMIT}"
        if "$CACHE_MANAGER" get haf "${HAF_COMMIT}" "$LOCAL_CACHE"; then
          DATA_SOURCE="$LOCAL_CACHE"
        else
          echo "ERROR: Failed to get cache for HAF commit ${HAF_COMMIT}"
          exit 1
        fi
      fi
      echo "Storing pipeline cache: type=${PIPELINE_CACHE_TYPE} key=${PIPELINE_CACHE_KEY}"
      "$CACHE_MANAGER" put "${PIPELINE_CACHE_TYPE}" "${PIPELINE_CACHE_KEY}" "$DATA_SOURCE"
      echo "Pipeline cache stored successfully"
  tags:
    - data-cache-storage
    - fast

start_haf_as_service:
  extends: .job-defaults
  image: "registry.gitlab.syncad.com/hive/haf/ci-base-image:ubuntu24.04-10"
  stage: build_and_test_phase_2
  needs:
    - prepare_haf_data
    - replay_data_copy
  services:
    - name: "registry.gitlab.syncad.com/hive/haf:9ce4243d"
      alias: haf-instance
      variables:
        PG_ACCESS: |
          host    all              haf_admin        0.0.0.0/0    trust
        DATA_SOURCE: "${PIPELINE_DATA_CACHE_LOCAL}"
        LOG_FILE: $CI_JOB_NAME.log
      command: ["--replay-blockchain", "--stop-at-block=5000000"]
  before_script: *fetch_pipeline_cache
  script:
    - sleep 60
    - curl -I haf-instance:8091 || (echo "error connecting to service hived-instance" && false)
  tags:
    - data-cache-storage
    - fast

dead_app_auto_detach:
  extends: .job-defaults
  image: "registry.gitlab.syncad.com/hive/haf/ci-base-image:ubuntu24.04-10"
  stage: build_and_test_phase_2
  needs:
    - prepare_haf_data
    - replay_data_copy
  services:
    - name: "registry.gitlab.syncad.com/hive/haf:9ce4243d"
      alias: haf-instance
      variables:
        PG_ACCESS: |
          host    all              haf_admin        0.0.0.0/0    trust
        DATA_SOURCE: "${PIPELINE_DATA_CACHE_LOCAL}"
        LOG_FILE: $CI_JOB_NAME.log
      command: ["--replay-blockchain", "--stop-at-block=5000000"]
  before_script: *fetch_pipeline_cache
  script:
    - cd tests/integration/system/applications/auto_detaching
    - |
      python3 -c "
      import socket, sys, time
      for _ in range(60):
          try:
              socket.create_connection(('haf-instance', 5432), timeout=1)
              sys.exit(0)
          except:
              time.sleep(1)
      sys.exit(1)
      "
    - psql postgresql://haf_admin@haf-instance/haf_block_log -aw -v ON_ERROR_STOP=ON -f test_app.sql
  tags:
    - data-cache-storage
    - fast
