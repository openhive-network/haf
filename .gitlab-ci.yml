    - job: haf_image_build_testnet
      artifacts: true

.pytest_based:
  extends: .job-defaults
  variables:
    PYPROJECT_DIR: "$CI_PROJECT_DIR/tests/integration/haf-local-tools"
  before_script:
    # Initialize submodules (hive is on a feature branch)
    - !reference [.init_submodules, before_script]
    - echo -e "\e[0Ksection_start:$(date +%s):python_venv[collapsed=true]\r\e[0KCreating Python virtual environment..."
    # Install build tools for compiling C extensions (no Python 3.14 wheels available yet)
    - sudo apt-get update -qq && sudo apt-get install -y -qq build-essential libpq-dev python3-dev libffi-dev postgresql-client >/dev/null 2>&1 || true
    # Create isolated venv (no --system-site-packages) to avoid Python 3.12 packages conflicting with 3.14
    - python3 -m venv venv/
    - . venv/bin/activate
    - cd ${PYPROJECT_DIR}
    # Retry poetry install up to 3 times (transient network failures downloading packages)
    - |
      poetry_success=false
      for attempt in 1 2 3; do
        if poetry install; then
          poetry_success=true
          break
        fi
        echo "Poetry install attempt $attempt failed, retrying in 5s..."
        sleep 5
      done
      if [ "$poetry_success" != "true" ]; then
        echo "ERROR: Poetry install failed after 3 attempts"
        exit 1
      fi
    - !reference [.update_deps_for_tests, script]
    - cd $CI_PROJECT_DIR
    - echo -e "\e[0Ksection_end:$(date +%s):python_venv\r\e[0K"

haf_system_tests:
  extends: .job-defaults
  stage: build_and_test_phase_2
  needs:
    - job: haf_image_build_testnet
      artifacts: true
  image:
    name: $HAF_IMAGE_NAME
    entrypoint: [""]
  variables:
    PG_ACCESS: "$PG_ACCESS_LOCAL_TRUST"
    # Increase beekeepy HTTP probe timeout (default 5s is too short under CI load
    # when hived is still initializing sql_serializer after opening HTTP port)
    HELPY_COMMUNICATION_TIMEOUT_SECS: "15"
  before_script:
    # Install git, build tools, and Python 3.14 dev headers for submodule init and C extension compilation
    # libffi-dev: for cffi, python3-dev: for Python.h
    - sudo apt-get update -qq && sudo apt-get install -y -qq git build-essential libffi-dev python3-dev python3.14-dev 2>/dev/null || sudo apt-get install -y -qq git build-essential libffi-dev python3-dev || true
    - !reference [.init_submodules, before_script]
  script:
    - /home/hived/docker_entrypoint.sh --execute-maintenance-script=$CI_PROJECT_DIR/scripts/maintenance-scripts/run_haf_system_tests.sh
  artifacts:
    paths:
    - "haf_system_tests.log"
    - "**/generated_during_*"
    - "**/generated_by_package_fixtures"
    exclude: *artifact_excludes
    reports:
      junit:
        - tests/integration/system/haf/report.xml
        - scripts/tests/report.xml
    when: always
    expire_in: 1 week
  interruptible: true
  tags:
    - public-runner-docker
    - fastest

