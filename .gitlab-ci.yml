  needs:
    - job: haf_image_build_testnet
      artifacts: true
  image:
    name: $HAF_IMAGE_NAME
    entrypoint: [""]
  before_script:
    # Install git, build tools, and Python 3.14 dev headers for submodule init and C extension compilation
    # libffi-dev: for cffi, python3-dev: for Python.h
    - sudo apt-get update -qq && sudo apt-get install -y -qq git build-essential libffi-dev python3-dev python3.14-dev 2>/dev/null || sudo apt-get install -y -qq git build-essential libffi-dev python3-dev || true
