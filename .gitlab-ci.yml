.haf-service: &haf-service
  name: $HAF_IMAGE_NAME
  alias: haf-instance
  variables:
    # Allow access from any network (IPv4 and IPv6) to eliminate CI IP addressing problems when hfm runs as service
    PG_ACCESS: |
                "host    all              haf_admin        0.0.0.0/0    trust"
                "host    all              haf_admin        ::/0         trust"

    # Use direct path (avoids nested variable expansion failure in API-triggered pipelines)
    DATA_SOURCE: "/cache/haf_${HAF_COMMIT}"
    # Use local block_log to avoid NFS file locking issues when hived opens the files
    SHARED_BLOCK_LOG_DIR: "$BLOCK_LOG_SOURCE_DIR_5M"
    LOG_FILE: $CI_JOB_NAME.log
  command: ["--replay-blockchain", "--stop-at-block=5000000"]

.hfm-only-service: &hfm-only-service
  name: $HAF_IMAGE_NAME
  alias: hfm-only-instance
  variables:
    HAF_CI_MODE: "1"
    # Allow access from any network (IPv4 and IPv6) to eliminate CI IP addressing problems when hfm runs as service
    PG_ACCESS: |
                "host    all              haf_admin        0.0.0.0/0    trust"
                "host    all              haf_admin        ::/0         trust"
                "host    all              test_app_owner   0.0.0.0/0    trust"
                "host    all              test_app_owner   ::/0         trust"
                "host    all              hived            0.0.0.0/0    trust"
                "host    all              hived            ::/0         trust"
                "host    all              haf_maintainer   0.0.0.0/0    trust"
                "host    all              haf_maintainer   ::/0         trust"
                "host    all              all              0.0.0.0/0    scram-sha-256"
                "host    all              all              ::/0         scram-sha-256"
  command: [ "--execute-maintenance-script=${HAF_SOURCE_DIR:?}/scripts/maintenance-scripts/sleep_infinity.sh" ]

.hfm_functional_tests:
  extends: .job-defaults
  image:
    name: $HAF_IMAGE_NAME
    entrypoint: [""]
  stage: build_and_test_phase_1
  timeout: 80m
  variables:
    PG_ACCESS: "$PG_ACCESS_LOCAL_TRUST"
    # Let GitLab init submodules - HAF runtime image doesn't have git
    GIT_SUBMODULE_STRATEGY: recursive
  script:
    # Skip only when no .sql files changed at all (pure docs/config change).
    # When test .sql files change, we must run even with a cached image — the
    # test files come from the source checkout, not the image.
    - |
      if [[ "${ANY_SQL_CHANGED:-true}" == "false" ]]; then
        echo "Skipping hfm_functional_tests - no .sql files changed"
        exit 0
      fi
    # Fix workspace permissions - CI fetch strategy may leave directories owned by different users
    # Remove the sql_serializer symlink location to let CMake recreate it with current user permissions
    - rm -rf $CI_PROJECT_DIR/hive/libraries/plugins/sql_serializer 2>/dev/null || true
    - /home/hived/docker_entrypoint.sh --execute-maintenance-script=$CI_PROJECT_DIR/scripts/maintenance-scripts/run_hfm_functional_tests.sh
  artifacts:
    paths:
      - "**/*.log"
  interruptible: true
  tags:
    - public-runner-docker
    - fastest

hfm_functional_tests:
  extends: .hfm_functional_tests
  needs:
    - job: detect_changes
      artifacts: true
      optional: true  # Required for tag pipelines where detect_changes is skipped
    - job: haf_image_build
      artifacts: true

hfm_functional_tests_testnet:
  extends: .hfm_functional_tests
  needs:
    - job: detect_changes
      artifacts: true
