stages:
  - detect                     # detect_changes runs here to set skip variables
  - build_and_test_phase_1
  - build_and_test_phase_2
  - docker_build
  - deploy
  - cleanup
  - publish

variables:
  PYTEST_NUMBER_OF_PROCESSES: 8
  CTEST_NUMBER_OF_JOBS: 4
  # HAF_COMMIT is used as cache key - in HAF's own CI, it's the current commit
  HAF_COMMIT: $CI_COMMIT_SHA
  # Enable CI-specific PostgreSQL config with reduced memory (4GB shared_buffers vs 16GB)
  # This allows multiple concurrent HAF jobs on builders with limited RAM
  HAF_CI_MODE: "1"
  # Hive ref for fetching CI helper scripts at runtime (symlinks don't work without submodule checkout)
  # Should match the ref used in scripts/ci-helpers/prepare_data_image_job.yml include
  HIVE_SCRIPTS_REF: "8d24f312c29a3d61cf684b5bf707cc3b65d304cf"

  # =============================================================================
  # Quick Test / Auto-Skip Mode
  # =============================================================================
  # Two ways to skip builds and use cached replay data:
  #
  # 1. AUTOMATIC (recommended): When only tests/docs/SQL change, builds are
  #    automatically skipped and cached data is used. No configuration needed.
  #
  # 2. MANUAL: Set QUICK_TEST=true to force skip mode with a specific cache:
  #    - QUICK_TEST=true
  #    - QUICK_TEST_HAF_COMMIT=<sha>  (required - find with list-haf-caches.sh)
  #    - QUICK_TEST_HAF_IMAGE=<image> (optional - defaults to :develop)
  #    - QUICK_TEST_JOBS=<jobs>       (optional - comma-separated extra jobs)
  #
  # Find available caches: ./scripts/ci-helpers/list-haf-caches.sh --recent
  # =============================================================================
  QUICK_TEST: "false"
  QUICK_TEST_HAF_COMMIT: ""   # Required when QUICK_TEST=true
  QUICK_TEST_HAF_IMAGE: ""    # Optional - defaults to registry.gitlab.syncad.com/hive/haf:develop
  QUICK_TEST_JOBS: ""         # Optional - additional jobs to run (comma-separated)
  # Auto-populated by detect_changes job:
  AUTO_SKIP_BUILD: "false"    # Set to true when only tests/docs/SQL changed
  AUTO_SKIP_REPLAY: "false"   # Set to true when only tests/docs changed (no SQL)
  AUTO_CACHE_COMMIT: ""       # Most recent cached HAF commit

  # Fetch strategy reuses workspace between jobs, reducing GitLab server load.
  # Full clone (depth 0) enables efficient incremental fetches - shallow clones
  # don't reduce server CPU and make fetch less effective.
  GIT_STRATEGY: fetch
  GIT_DEPTH: 0
  GIT_SUBMODULE_DEPTH: 0
  # Disable automatic submodule fetching - we handle it manually in before_script
  # This is needed because the hive submodule is on a feature branch
  GIT_SUBMODULE_STRATEGY: none
  # Force HTTPS for submodule URLs (helps with nested submodules)
  GIT_SUBMODULE_FORCE_HTTPS: "true"
  # Allow file:// protocol for nested submodules (required for test-tools in hive)
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: "protocol.file.allow"
  GIT_CONFIG_VALUE_0: "always"
  # Temporary: separate clone path prevents clone-strategy jobs from erasing
  # fetch workspaces during transition. Remove once all projects use fetch.
  GIT_CLONE_PATH: $CI_BUILDS_DIR/fetch/$CI_RUNNER_SHORT_TOKEN/$CI_CONCURRENT_ID/$CI_PROJECT_PATH

  FF_ENABLE_JOB_CLEANUP: 1
  FF_NETWORK_PER_BUILD: 1

  # Docker image tags from common-ci-configuration with util-linux for NFS flock support
  DOCKER_BUILDER_TAG: "3dd346380da7f28cdaf3ef3955559c905d94bd1c"
  DOCKER_DIND_TAG: "3dd346380da7f28cdaf3ef3955559c905d94bd1c"

  # Use Python 3.14 ci-base-image from common-ci-configuration
  # uses registry.gitlab.syncad.com/hive/common-ci-configuration/ci-base-image:ubuntu24.04-py3.14-2
  BUILDER_IMAGE_TAG: ":ubuntu24.04-py3.14-2"
  HIVE_CI_BASE_IMAGE: "registry.gitlab.syncad.com/hive/common-ci-configuration/ci-base-image${BUILDER_IMAGE_TAG}"
  # Override PYTHON_IMAGE from common-ci-configuration to use Python 3.14
  PYTHON_IMAGE: "registry.gitlab.syncad.com/hive/common-ci-configuration/ci-base-image${BUILDER_IMAGE_TAG}"
  CI_DEBUG_SERVICES: "true"
  SETUP_SCRIPTS_PATH: "$CI_PROJECT_DIR/scripts"
  TEST_TOOLS_NODE_DEFAULT_WAIT_FOR_LIVE_TIMEOUT: 60
  DATA_CACHE_HAF_PREFIX: "/cache/haf"
  # Local path for HAF data cache (fetched from NFS by cache-manager)
  HAF_DATA_CACHE_LOCAL: "/cache/haf_${HAF_COMMIT}"
  BLOCK_LOG_SOURCE_DIR_5M: /blockchain/block_log_5m
  # Mirrornet snapshot path on NFS for cross-builder access
  SNAPSHOTS_PATH: /nfs/ci-cache/haf/snapshots_pipeline_${CI_PIPELINE_ID}
  BLOCK_LOG_SOURCE_DIR_MIRRORNET_5M: /cache/block_log_5m_mirrornet

  # sccache distributed compiler cache (Redis backend on builder-10)
  SCCACHE_REDIS: "redis://192.168.50.109:6379"
  SCCACHE_CACHE_SIZE: "50G"

  # PostgreSQL access config for localhost-only jobs (IPv4 and IPv6)
  PG_ACCESS_LOCAL_TRUST: |
    local   all              all                            trust
    host    all              all        127.0.0.1/32        trust
    host    all              all        ::1/128             trust

include:
  - template: Workflows/Branch-Pipelines.gitlab-ci.yml
  - local: '/scripts/ci-helpers/prepare_data_image_job.yml'
  # Do not include common-ci-configuration here, it is already referenced by scripts/ci-helpers/prepare_data_image_job.yml included from Hive

# Use common git cleanup template from common-ci-configuration
# Includes: corrupt repo/submodule cleanup, directory-to-submodule transitions, permission fixes
default:
  hooks:
    pre_get_sources_script:
      - !reference [.haf_git_corruption_cleanup, hooks, pre_get_sources_script]
      - !reference [.haf_permission_fix, hooks, pre_get_sources_script]

# Reusable YAML anchors
.artifact_excludes: &artifact_excludes
  - "**/generated_during_*/**/block_log"
  - "**/generated_during_*/**/block_log.artifacts"
  - "**/generated_during_*/**/shared_memory.bin"
  - "**/generated_during_*/**/*.sst"

# Manual submodule initialization - needed because hive submodule is on a feature branch
# This version only clones test-related submodules (test-tools, tests_api) - use for test jobs
.init_submodules:
  before_script: &init_submodules
    - |
      echo -e "\e[0Ksection_start:$(date +%s):init_submodules[collapsed=true]\r\e[0KInitializing submodules..."
      git config --global --add safe.directory '*'
      # Get the commit we need from the hive submodule
      HIVE_URL="https://gitlab.syncad.com/hive/hive.git"
      HIVE_COMMIT=$(git ls-tree HEAD hive | awk '{print $3}')
      echo "Need hive submodule at commit $HIVE_COMMIT"
      # Remove existing hive directory if it exists (can be stale from GIT_STRATEGY=fetch)
      # Use sudo to handle files created by different users in previous jobs
      sudo rm -rf hive 2>/dev/null || rm -rf hive
      # Clone and fetch from develop branch
      git clone --no-checkout "$HIVE_URL" hive
      cd hive
      git fetch origin develop
      git checkout $HIVE_COMMIT
      # Initialize only test-related submodules inside hive (skip rocksdb, zstd, fc, appbase, compression_dictionaries)
      git submodule update --init tests/python/hive-local-tools/test-tools tests/python/hive-local-tools/tests_api
      cd ..
      # Update any remaining HAF submodules (currently none besides hive which is handled above)
      git submodule update --init
      echo -e "\e[0Ksection_end:$(date +%s):init_submodules\r\e[0K"

# Full submodule initialization - use for jobs that need to rebuild HAF (requires rocksdb, zstd, etc.)
.init_submodules_full:
  before_script: &init_submodules_full
    - |
      echo -e "\e[0Ksection_start:$(date +%s):init_submodules[collapsed=true]\r\e[0KInitializing submodules (full)..."
      git config --global --add safe.directory '*'
      # Get the commit we need from the hive submodule
      HIVE_URL="https://gitlab.syncad.com/hive/hive.git"
      HIVE_COMMIT=$(git ls-tree HEAD hive | awk '{print $3}')
      echo "Need hive submodule at commit $HIVE_COMMIT"
      # Remove existing hive directory if it exists (can be stale from GIT_STRATEGY=fetch)
      # Use sudo to handle files created by different users in previous jobs
      sudo rm -rf hive 2>/dev/null || rm -rf hive
      # Clone and fetch from develop branch
      git clone --no-checkout "$HIVE_URL" hive
      cd hive
      git fetch origin develop
      git checkout $HIVE_COMMIT
      # Initialize ALL submodules recursively (needed for rebuilding HAF)
      git submodule update --init --recursive
      cd ..
      # Update any remaining HAF submodules (currently none besides hive which is handled above)
      git submodule update --init
      echo -e "\e[0Ksection_end:$(date +%s):init_submodules\r\e[0K"

.fetch_haf_cache: &fetch_haf_cache
  # Get HAF data from NFS via cache-manager (commit-specific cache)
  - |
    echo -e "\e[0Ksection_start:$(date +%s):copy_data[collapsed=true]\r\e[0KFetching HAF data via cache-manager..."
    set -e
    # Fetch cache-manager from common-ci-configuration
    CACHE_MANAGER="/tmp/cache-manager.sh"
    curl -fsSL "https://gitlab.syncad.com/hive/common-ci-configuration/-/raw/develop/scripts/cache-manager.sh" -o "$CACHE_MANAGER"
    chmod +x "$CACHE_MANAGER"
    echo "Fetching cache: type=haf key=${HAF_COMMIT}"
    echo "Destination: ${HAF_DATA_CACHE_LOCAL}"

    # Clean up stale cache directory if it exists with permission issues
    # This prevents extraction failures when previous runs left bad state
    if [[ -d "${HAF_DATA_CACHE_LOCAL}" ]]; then
      if ! touch "${HAF_DATA_CACHE_LOCAL}/.write_test" 2>/dev/null; then
        echo "Stale cache with permission issues detected, cleaning up..."
        sudo rm -rf "${HAF_DATA_CACHE_LOCAL}" || rm -rf "${HAF_DATA_CACHE_LOCAL}" || true
      else
        rm -f "${HAF_DATA_CACHE_LOCAL}/.write_test"
      fi
    fi

    # cache-manager handles extraction and permission restoration
    "$CACHE_MANAGER" get "haf" "${HAF_COMMIT}" "${HAF_DATA_CACHE_LOCAL}"

    echo "HAF data fetch complete."
    ls -la "$HAF_DATA_CACHE_LOCAL/datadir/"
    echo -e "\e[0Ksection_end:$(date +%s):copy_data\r\e[0K"

verify_poetry_lock_sanity:
  extends: .verify_poetry_lock_sanity_template
  stage: build_and_test_phase_1
  # Allow failure until Python 3.14 compatible wax/schemas are published to GitLab PyPI
  allow_failure: true
  variables:
    PYPROJECT_DIR: "$CI_PROJECT_DIR/tests/integration/haf-local-tools"
  before_script:
    # Initialize submodules (hive is on a feature branch with updated test-tools)
    - !reference [.init_submodules, before_script]
    # Regenerate poetry.lock for Python 3.14 compatibility
    - poetry -C "${PYPROJECT_DIR}" env use python3
    - source $(poetry -C "${PYPROJECT_DIR}" env info --path)/bin/activate
    - poetry -C "${PYPROJECT_DIR}" lock --no-update 2>/dev/null || poetry -C "${PYPROJECT_DIR}" lock
    - poetry -C "${PYPROJECT_DIR}" install
  tags:
    - public-runner-docker

# =============================================================================
# Change Detection & Quick Test Setup
# =============================================================================
# Detects if only tests/docs changed, finds cached replay data, and exports
# all necessary variables for downstream jobs:
#   AUTO_SKIP_BUILD  - true if build can be skipped
#   AUTO_SKIP_REPLAY - true if replay can be skipped
#   HAF_COMMIT       - commit SHA for cached data (when skipping)
#   HAF_IMAGE_NAME   - HAF image to use (when skipping build)
detect_changes:
  extends: .job-defaults
  stage: detect
  image: "$HIVE_CI_BASE_IMAGE"
  rules:
    # Skip for tags (always do full build for releases)
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success
  before_script: *init_submodules
  script:
    - |
      # Initialize defaults
      CAN_SKIP_BUILD=false
      CAN_SKIP_REPLAY=false
      CACHE_COMMIT=""
      HAF_IMG=""

      # Handle manual QUICK_TEST mode
      if [[ "$QUICK_TEST" == "true" ]]; then
        echo "=== Manual QUICK_TEST Mode ==="
        CAN_SKIP_BUILD=true
        CAN_SKIP_REPLAY=true
        CACHE_COMMIT="${QUICK_TEST_HAF_COMMIT}"
        if [[ -z "$CACHE_COMMIT" ]]; then
          echo "ERROR: QUICK_TEST_HAF_COMMIT must be set when QUICK_TEST=true"
          echo ""
          echo "Find available caches:"
          echo "  ./scripts/ci-helpers/list-haf-caches.sh --recent"
          exit 1
        fi
        # Use provided image or default to commit-specific tag
        CACHE_SHORT="${CACHE_COMMIT:0:8}"
        HAF_IMG="${QUICK_TEST_HAF_IMAGE:-registry.gitlab.syncad.com/hive/haf:$CACHE_SHORT}"
        echo "Using cached data from: $CACHE_COMMIT"
        echo "Using HAF image: $HAF_IMG"
      else
        # Automatic detection mode
        echo "=== Detecting Changed Files ==="

        # Get changed files based on pipeline type
        if [[ -n "${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}" ]]; then
          BASE_SHA="$CI_MERGE_REQUEST_DIFF_BASE_SHA"
          echo "MR pipeline: comparing against target branch"
        elif [[ "${CI_PIPELINE_SOURCE:-}" == "push" ]]; then
          BASE_SHA="HEAD~1"
          echo "Push pipeline: comparing against previous commit"
        else
          BASE_SHA=$(git merge-base HEAD origin/develop 2>/dev/null || echo "HEAD~1")
          echo "Other pipeline: comparing against develop"
        fi

        echo "Comparing $BASE_SHA to HEAD"
        CHANGED_FILES=$(git diff --name-only "$BASE_SHA" HEAD 2>/dev/null || git diff --name-only HEAD~1 HEAD)

        echo "Changed files:"
        echo "$CHANGED_FILES" | head -50

        # Two levels of skip detection:
        # 1. Skip BUILD: tests, docs, SQL (SQL doesn't affect C++ compilation)
        # 2. Skip REPLAY: only tests, docs (SQL affects replay behavior)

        # Note: Avoid \.txt$ as it matches CMakeLists.txt
        SKIP_BUILD_PATTERNS="^tests/|^docs/|\.sql$|\.md$|^README|^CHANGELOG|^LICENSE"
        SKIP_REPLAY_PATTERNS="^tests/|^docs/|\.md$|^README|^CHANGELOG|^LICENSE"

        NEEDS_BUILD=$(echo "$CHANGED_FILES" | grep -vE "$SKIP_BUILD_PATTERNS" || true)
        NEEDS_REPLAY=$(echo "$CHANGED_FILES" | grep -vE "$SKIP_REPLAY_PATTERNS" || true)

        if [[ -z "$NEEDS_BUILD" ]]; then
          CAN_SKIP_BUILD=true
          echo ""
          echo "=== Can skip build (only tests/docs/SQL changed) ==="
        fi

        if [[ -z "$NEEDS_REPLAY" ]]; then
          CAN_SKIP_REPLAY=true
          echo "=== Can skip replay (only tests/docs changed, no SQL) ==="
        elif [[ "$CAN_SKIP_BUILD" == "true" ]]; then
          echo "=== SQL changed - can skip build but must replay ==="
          echo "SQL files changed:"
          echo "$NEEDS_REPLAY" | grep '\.sql$' | head -10
        fi

        # Find cached data/images when we can skip something
        # Docker login for image verification
        echo "$CI_JOB_TOKEN" | docker login -u gitlab-ci-token --password-stdin "$CI_REGISTRY" 2>/dev/null || true

        NFS_CACHE_PATH="/nfs/ci-cache/haf"
        if [[ -d "$NFS_CACHE_PATH" ]]; then
          # Look through recent cache files to find one with valid Docker images
          for TAR in $(ls -t "$NFS_CACHE_PATH"/*.tar 2>/dev/null | head -5); do
            TEST_COMMIT=$(basename "$TAR" .tar)
            CACHE_SHORT="${TEST_COMMIT:0:8}"

            # Verify Docker images exist for all network types
            IMAGES_EXIST=true
            for NETWORK in "" "/testnet" "/mirrornet"; do
              IMG="registry.gitlab.syncad.com/hive/haf${NETWORK}:${CACHE_SHORT}"
              if ! docker manifest inspect "$IMG" >/dev/null 2>&1; then
                echo "Image not found: $IMG"
                IMAGES_EXIST=false
                break
              fi
            done

            if [[ "$IMAGES_EXIST" == "true" ]]; then
              # Verify cache commit is reachable from current branch to avoid schema mismatches
              # This prevents using caches from feature branches with incompatible schema changes
              if ! git merge-base --is-ancestor "$TEST_COMMIT" HEAD 2>/dev/null; then
                echo "Cache $TEST_COMMIT not ancestor of HEAD - skipping (incompatible branch)"
                continue
              fi
              CACHE_COMMIT="$TEST_COMMIT"
              echo "Found cached data with valid images: $CACHE_COMMIT"
              break
            else
              echo "Cache $TEST_COMMIT missing Docker images, trying next..."
            fi
          done
        fi

        # For replay skip, we need cached data with images
        if [[ "$CAN_SKIP_REPLAY" == "true" ]] && [[ -z "$CACHE_COMMIT" ]]; then
          echo "WARNING: No cached data with valid images found - cannot skip replay"
          CAN_SKIP_REPLAY=false
        fi

        # For build skip, we need a cached commit with valid Docker images
        if [[ "$CAN_SKIP_BUILD" == "true" ]] && [[ -z "$CACHE_COMMIT" ]]; then
          echo "WARNING: No cached data with valid images found - cannot skip build"
          CAN_SKIP_BUILD=false
        fi

        if [[ "$CAN_SKIP_BUILD" == "false" ]]; then
          echo ""
          echo "=== Full build required ==="
          echo "Files requiring build:"
          echo "$NEEDS_BUILD" | head -20
        fi
      fi

      # Export results
      echo "AUTO_SKIP_BUILD=$CAN_SKIP_BUILD" >> detect_changes.env
      echo "AUTO_SKIP_REPLAY=$CAN_SKIP_REPLAY" >> detect_changes.env

      # Export HAF_COMMIT and HAF_IMAGE_NAME when skipping build
      # Note: CAN_SKIP_BUILD is only true if CACHE_COMMIT was found (validated above)
      if [[ "$CAN_SKIP_BUILD" == "true" ]]; then
        echo "HAF_COMMIT=$CACHE_COMMIT" >> detect_changes.env
        # Use image tag based on cache commit (first 8 chars)
        CACHE_SHORT="${CACHE_COMMIT:0:8}"
        HAF_IMG="${QUICK_TEST_HAF_IMAGE:-registry.gitlab.syncad.com/hive/haf:$CACHE_SHORT}"
        echo "HAF_IMAGE_NAME=$HAF_IMG" >> detect_changes.env
      fi

      echo ""
      echo "=== Summary ==="
      cat detect_changes.env
  artifacts:
    reports:
      dotenv: detect_changes.env
    expire_in: 1 day
  tags:
    - data-cache-storage  # Needs NFS access to find caches

.haf_image_build:
  extends: .prepare_haf_image
  stage: build_and_test_phase_1
  variables:
    # Build jobs need ALL submodules (including rocksdb, zstd) for compilation
    # Override the global 'none' strategy with 'recursive' for builds
    GIT_SUBMODULE_STRATEGY: recursive
  needs:
    - job: detect_changes
      artifacts: true
      optional: true  # Optional for tagged builds where detect_changes is skipped
  before_script:
    # Fix git safe.directory issue on some runners (CVE-2022-24765)
    - git config --global --add safe.directory '*'
    # Fetch required scripts from hive repo (symlinks don't work without submodule checkout)
    - |
      HIVE_RAW_URL="https://gitlab.syncad.com/hive/hive/-/raw/${HIVE_SCRIPTS_REF}/scripts/ci-helpers"
      SCRIPTS_PATH="${CI_PROJECT_DIR}/scripts"
      for script in export-data-from-docker-image.sh; do
        TARGET="$SCRIPTS_PATH/ci-helpers/$script"
        # Remove dangling symlink before fetching
        rm -f "$TARGET"
        echo "Fetching $script from hive@${HIVE_SCRIPTS_REF}..."
        curl -fsSL "${HIVE_RAW_URL}/${script}" -o "$TARGET"
        chmod +x "$TARGET"
      done
    # Early exit if QUICK_TEST or AUTO_SKIP_BUILD is true
    # This allows us to skip the expensive build while still producing required artifacts
    - |
      SKIP_BUILD=false
      CACHE_COMMIT=""

      # Check for manual QUICK_TEST mode
      if [[ "${QUICK_TEST:-false}" == "true" ]]; then
        echo "=== Skipping build (QUICK_TEST=true) ==="
        SKIP_BUILD=true
        CACHE_COMMIT="${QUICK_TEST_HAF_COMMIT}"
        if [[ -z "$CACHE_COMMIT" ]]; then
          echo "ERROR: QUICK_TEST=true but QUICK_TEST_HAF_COMMIT not set"
          exit 1
        fi
      # Check for automatic skip mode (from detect_changes)
      elif [[ "${AUTO_SKIP_BUILD:-false}" == "true" ]]; then
        echo "=== Skipping build (AUTO_SKIP_BUILD=true) ==="
        SKIP_BUILD=true
        CACHE_COMMIT="${HAF_COMMIT}"
      fi

      if [[ "$SKIP_BUILD" == "true" ]]; then
        CACHE_SHORT="${CACHE_COMMIT:0:8}"
        case "${HIVE_NETWORK_TYPE:-mainnet}" in
          testnet)
            SKIP_IMAGE_NAME="registry.gitlab.syncad.com/hive/haf/testnet:${CACHE_SHORT}"
            ;;
          mirrornet)
            SKIP_IMAGE_NAME="registry.gitlab.syncad.com/hive/haf/mirrornet:${CACHE_SHORT}"
            ;;
          *)
            SKIP_IMAGE_NAME="registry.gitlab.syncad.com/hive/haf:${CACHE_SHORT}"
            ;;
        esac
        echo "Using cached HAF image: ${SKIP_IMAGE_NAME}"
        # Create dotenv artifact with cached image name
        echo "HAF_IMAGE_NAME=${SKIP_IMAGE_NAME}" > docker_image_name.env
        echo "HAF_INSTANCE=${SKIP_IMAGE_NAME}" >> docker_image_name.env
        # Extract binaries from cached Docker image (downstream jobs need them)
        echo "Extracting binaries from cached image..."
        SCRIPTS_PATH="${CI_PROJECT_DIR}/scripts"
        "$SCRIPTS_PATH/ci-helpers/export-data-from-docker-image.sh" "${SKIP_IMAGE_NAME}" "${BINARY_CACHE_PATH:-$CI_PROJECT_DIR/haf-binaries}"
        chmod -Rc a+rwx "${BINARY_CACHE_PATH:-$CI_PROJECT_DIR/haf-binaries}"
        ls -la "${BINARY_CACHE_PATH:-$CI_PROJECT_DIR/haf-binaries}/"
        echo "Build skipped - binaries extracted from cached image"
        exit 0
      fi
    # Initialize submodules for fresh build (required for nested submodules like rocksdb)
    # Uses full submodule init since builds need rocksdb, zstd, fc, etc.
    - !reference [.init_submodules_full, before_script]
  tags:
    - public-runner-docker

haf_image_build:
  extends: .haf_image_build
  variables:
    BINARY_CACHE_PATH: "$CI_PROJECT_DIR/haf-binaries"
    HIVE_NETWORK_TYPE: mainnet
  tags:
    - bigjob
  after_script:
    - |
      source docker_image_name.env
      echo "Adding latest/stable/version tags for mainnet image..."
      # Pull image to local daemon (may not be loaded when using cached builds)
      docker pull $HAF_INSTANCE || echo "Warning: docker pull failed"
      docker images
      if [[ "$CI_COMMIT_BRANCH" == "develop" ]]; then
        docker tag $HAF_INSTANCE ${CI_REGISTRY_IMAGE}:latest
        docker push ${CI_REGISTRY_IMAGE}:latest
      elif [[ "$CI_COMMIT_BRANCH" == "master" ]]; then
        docker tag $HAF_INSTANCE ${CI_REGISTRY_IMAGE}:stable
        docker push ${CI_REGISTRY_IMAGE}:stable
      fi
      if [[ -n "$CI_COMMIT_TAG" && "$CI_COMMIT_REF_PROTECTED" == "true" ]]; then
        docker tag $HAF_INSTANCE ${CI_REGISTRY_IMAGE}:${CI_COMMIT_TAG}
        docker push ${CI_REGISTRY_IMAGE}:${CI_COMMIT_TAG}
      fi

haf_image_build_testnet:
  extends: .haf_image_build
  variables:
    BINARY_CACHE_PATH: "$CI_PROJECT_DIR/haf-testnet-binaries"
    HIVE_NETWORK_TYPE: testnet
  tags:
    - bigjob
  after_script:
    - |
      source docker_image_name.env
      echo "Adding latest/stable/version tags for testnet image..."
      # Pull image to local daemon (may not be loaded when using cached builds)
      docker pull $HAF_INSTANCE || echo "Warning: docker pull failed"
      docker images
      IMAGE_NAME_PREFIX="${CI_REGISTRY_IMAGE}/testnet:"
      if [[ "$CI_COMMIT_BRANCH" == "develop" ]]; then
        docker tag $HAF_INSTANCE ${IMAGE_NAME_PREFIX}latest
        docker push ${IMAGE_NAME_PREFIX}latest
      elif [[ "$CI_COMMIT_BRANCH" == "master" ]]; then
        docker tag $HAF_INSTANCE ${IMAGE_NAME_PREFIX}stable
        docker push ${IMAGE_NAME_PREFIX}stable
      fi
      if [[ -n "$CI_COMMIT_TAG" && "$CI_COMMIT_REF_PROTECTED" == "true" ]]; then
        docker tag $HAF_INSTANCE ${IMAGE_NAME_PREFIX}${CI_COMMIT_TAG}
        docker push ${IMAGE_NAME_PREFIX}${CI_COMMIT_TAG}
      fi

haf_image_build_mirrornet:
  extends: .haf_image_build
  variables:
    BINARY_CACHE_PATH: "$CI_PROJECT_DIR/haf-mirrornet-binaries"
    HIVE_NETWORK_TYPE: mirrornet
  tags:
    - bigjob
  # Tag mirrornet images for Denser's CI and external publishing
  after_script:
    - |
      source docker_image_name.env
      echo "Adding latest/stable/version tags for mirrornet image..."
      # Pull image to local daemon (may not be loaded when using cached builds)
      docker pull $HAF_INSTANCE || echo "Warning: docker pull failed"
      docker images
      IMAGE_NAME_PREFIX="${CI_REGISTRY_IMAGE}/mirrornet:"
      if [[ "$CI_COMMIT_BRANCH" == "develop" ]]; then
        docker tag $HAF_INSTANCE ${IMAGE_NAME_PREFIX}latest
        docker push ${IMAGE_NAME_PREFIX}latest
      elif [[ "$CI_COMMIT_BRANCH" == "master" ]]; then
        docker tag $HAF_INSTANCE ${IMAGE_NAME_PREFIX}stable
        docker push ${IMAGE_NAME_PREFIX}stable
      fi
      if [[ -n "$CI_COMMIT_TAG" && "$CI_COMMIT_REF_PROTECTED" == "true" ]]; then
        docker tag $HAF_INSTANCE ${IMAGE_NAME_PREFIX}${CI_COMMIT_TAG}
        docker push ${IMAGE_NAME_PREFIX}${CI_COMMIT_TAG}
      fi

.haf-service: &haf-service
  name: $HAF_IMAGE_NAME
  alias: haf-instance
  variables:
    # Allow access from any network (IPv4 and IPv6) to eliminate CI IP addressing problems when hfm runs as service
    PG_ACCESS: |
                "host    all              haf_admin        0.0.0.0/0    trust"
                "host    all              haf_admin        ::/0         trust"

    # Use local cache path (fetched from NFS by cache-manager)
    DATA_SOURCE: "${HAF_DATA_CACHE_LOCAL}"
    # Use local block_log to avoid NFS file locking issues when hived opens the files
    SHARED_BLOCK_LOG_DIR: "$BLOCK_LOG_SOURCE_DIR_5M"
    LOG_FILE: $CI_JOB_NAME.log
  command: ["--replay-blockchain", "--stop-at-block=5000000"]

.hfm-only-service: &hfm-only-service
  name: $HAF_IMAGE_NAME
  alias: hfm-only-instance
  variables:
    HAF_CI_MODE: "1"
    # Allow access from any network (IPv4 and IPv6) to eliminate CI IP addressing problems when hfm runs as service
    PG_ACCESS: |
                "host    all              haf_admin        0.0.0.0/0    trust"
                "host    all              haf_admin        ::/0         trust"
                "host    all              test_app_owner   0.0.0.0/0    trust"
                "host    all              test_app_owner   ::/0         trust"
                "host    all              hived            0.0.0.0/0    trust"
                "host    all              hived            ::/0         trust"
                "host    all              haf_maintainer   0.0.0.0/0    trust"
                "host    all              haf_maintainer   ::/0         trust"
                "host    all              all              0.0.0.0/0    scram-sha-256"
                "host    all              all              ::/0         scram-sha-256"
  command: [ "--execute-maintenance-script=${HAF_SOURCE_DIR:?}/scripts/maintenance-scripts/sleep_infinity.sh" ]

.hfm_functional_tests:
  extends: .job-defaults
  image:
    name: $HAF_IMAGE_NAME
    entrypoint: [""]
  stage: build_and_test_phase_1
  timeout: 80m
  variables:
    PG_ACCESS: "$PG_ACCESS_LOCAL_TRUST"
    # Let GitLab init submodules - HAF runtime image doesn't have git
    GIT_SUBMODULE_STRATEGY: recursive
  script:
    # Skip when image commit doesn't match source commit - this test validates extension
    # upgrades and requires the image and source to be from the same commit.
    # This happens in quick-test mode OR when only CI config changed (image reused).
    - |
      if [[ "${AUTO_SKIP_BUILD:-false}" == "true" ]]; then
        echo "Skipping hfm_functional_tests - AUTO_SKIP_BUILD=true"
        exit 0
      fi
      # Extract commit from image tag (e.g., registry.gitlab.syncad.com/hive/haf:756d1886)
      IMAGE_COMMIT="${HAF_IMAGE_NAME##*:}"
      SOURCE_COMMIT="${CI_COMMIT_SHORT_SHA}"
      if [[ "$IMAGE_COMMIT" != "$SOURCE_COMMIT" ]]; then
        echo "Skipping hfm_functional_tests - image/source commit mismatch"
        echo "  Image commit:  $IMAGE_COMMIT (from $HAF_IMAGE_NAME)"
        echo "  Source commit: $SOURCE_COMMIT"
        echo "This test requires image and source from the same commit."
        exit 0
      fi
    # Fix workspace permissions - CI fetch strategy may leave directories owned by different users
    # Remove the sql_serializer symlink location to let CMake recreate it with current user permissions
    - rm -rf $CI_PROJECT_DIR/hive/libraries/plugins/sql_serializer 2>/dev/null || true
    - /home/haf_admin/docker_entrypoint.sh --execute-maintenance-script=$CI_PROJECT_DIR/scripts/maintenance-scripts/run_hfm_functional_tests.sh
  artifacts:
    paths:
      - "**/*.log"
  interruptible: true
  tags:
    - public-runner-docker
    - fastest

hfm_functional_tests:
  extends: .hfm_functional_tests
  needs:
    - job: detect_changes
      artifacts: true
      optional: true  # Required for tag pipelines where detect_changes is skipped
    - job: haf_image_build
      artifacts: true

hfm_functional_tests_testnet:
