# job responsible for replaying data using preconfigured filtering options specified in given config.ini file
replay_filtered_haf_data_accounts_body_operations:
  extends: .prepare_haf_data_5m
  needs:
    - job: haf_image_build
      artifacts: true
  stage: build_and_test_phase_1
  timeout: 80m
  variables:
    HIVE_NETWORK_TYPE: mainnet
    BLOCK_LOG_SOURCE_DIR: "$BLOCK_LOG_SOURCE_DIR_5M"
    CONFIG_INI_SOURCE: "$CI_PROJECT_DIR/tests/integration/replay/patterns/accounts_body_operations_filtered/config.ini"
    # Use local cache for replay, then store via cache-manager
    # Local path must match cache type (haf_filtered) for NFS fallback to work
    DATA_CACHE_DIR: "/cache/haf_filtered_${CI_PIPELINE_ID}_filtered"
    FILTERED_CACHE_KEY: "${CI_PIPELINE_ID}_filtered"
  script:
    - !reference [.prepare_haf_data_5m, script]
    - |
      # Store filtered data via cache-manager (creates tar on NFS)
      # cache-manager.sh was already fetched by .prepare_haf_data_5m script
      CACHE_MANAGER="/tmp/cache-manager.sh"
      echo "Storing filtered cache: type=haf_filtered key=${FILTERED_CACHE_KEY}"
      "$CACHE_MANAGER" put "haf_filtered" "${FILTERED_CACHE_KEY}" "${DATA_CACHE_DIR}"
      echo "Filtered cache stored successfully"
  tags:
    - public-runner-docker
    - data-cache-storage
    - fastest

block_api_tests:
  extends: .jmeter_benchmark_job
  stage: build_and_test_phase_2
  needs:
    - job: haf_image_build
      artifacts: true
    - job: replay_filtered_haf_data_accounts_body_operations
      artifacts: true

  variables:
    BENCHMARK_DIR: "$CI_PROJECT_DIR/hive/tests/python/hive-local-tools/tests_api/benchmarks"
    # Allow access from any network (IPv4 and IPv6) to eliminate CI IP addressing problems
    HAF_DB_ACCESS: |
      "host    all              haf_admin        0.0.0.0/0    trust"
      "host    all              haf_admin        ::/0         trust"
      "host    all              hived            0.0.0.0/0    trust"
      "host    all              hived            ::/0         trust"
      "host    all              hafah_user       0.0.0.0/0    trust"
      "host    all              hafah_user       ::/0         trust"
      "host    all              all              0.0.0.0/0    scram-sha-256"
      "host    all              all              ::/0         scram-sha-256"

    BENCHMARK_DB_URL: "postgresql://hived@haf-instance:5432/haf_block_log"
    # Local path for filtered replay data (service's copy_datadir.sh handles NFS fallback)
    # Must match DATA_CACHE_DIR in replay_filtered_haf_data_accounts_body_operations
    FILTERED_DATA_LOCAL: "/cache/haf_filtered_${CI_PIPELINE_ID}_filtered"

  services:
    - name: ${HAF_IMAGE_NAME}
      alias: haf-instance
      variables:
        PG_ACCESS: "${HAF_DB_ACCESS}"
        # Use direct path (avoids nested variable expansion failure in API-triggered pipelines)
        DATA_SOURCE: "/cache/haf_filtered_${CI_PIPELINE_ID}_filtered"
        LOG_FILE: $CI_JOB_NAME.log
      # Data is already replayed by replay_filtered_haf_data_accounts_body_operations
      # Just keep PostgreSQL running for the tests - no need to start hived
      command: ["--execute-maintenance-script=${HAF_SOURCE_DIR:?}/scripts/maintenance-scripts/sleep_infinity.sh"]
  tags:
    - public-runner-docker
    - data-cache-storage
    - fast

  before_script:
    # Install git (not in benchmark-test-runner image) for submodule init
    # Try apt-get (Debian/Ubuntu) then apk (Alpine)
    - (apt-get update -qq && apt-get install -y -qq git 2>/dev/null) || (apk add --no-cache git 2>/dev/null) || true
    - !reference [.init_submodules, before_script]
    # Wait for database to be ready (using Python since psql not available in this image)
    # Note: The service container copies data from NFS internally via copy_datadir.sh
    - |
      echo -e "\e[0Ksection_start:$(date +%s):wait_db[collapsed=true]\r\e[0KWaiting for database..."
      python3 -c "
      import socket
      import time
      host = 'haf-instance'
      port = 5432
      for i in range(120):
          try:
              s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
              s.settimeout(2)
              s.connect((host, port))
              s.close()
              print(f'Database is ready after {i+1} attempts')
              exit(0)
          except (socket.error, socket.timeout):
              print(f'Waiting for database... attempt {i+1}/120')
              time.sleep(5)
      print('ERROR: Database not ready after 120 attempts')
      exit(1)
      "
      echo -e "\e[0Ksection_end:$(date +%s):wait_db\r\e[0K"

  script:
    # run pattern tests
    - |
      echo -e "\e[0Ksection_start:$(date +%s):blocks_api_test[collapsed=true]\r\e[0KRunning blocks api tests..."
      cd "$BENCHMARK_DIR"
      python3 benchmark.py --loops 200 --threads 5 -n blocks_api -p 5432 -c perf_5M_light.csv --skip-version-check -d wdir --postgres $BENCHMARK_DB_URL --call-style postgres 2>&1 | tee -i $CI_PROJECT_DIR/python_benchmark.log
      echo -e "\e[0Ksection_end:$(date +%s):blocks_api_test\r\e[0K"

    # generate JUNIT report file
    - |
      echo -e "\e[0Ksection_start:$(date +%s):report[collapsed=true]\r\e[0KGenerating Junit report..."
      m2u --input "$BENCHMARK_DIR/wdir/raw_jmeter_report.xml" --output $CI_PROJECT_DIR/report.junit
      echo -e "\e[0Ksection_end:$(date +%s):report\r\e[0K"
  artifacts:
    name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
    reports:
      junit: $CI_PROJECT_DIR/report.junit
    paths:
      - $BENCHMARK_DIR/wdir
      - $CI_PROJECT_DIR/python_benchmark.log
    when: always
    expire_in: 1 week

