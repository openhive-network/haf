stages:
  - detect                     # detect_changes runs here to set skip variables
  - build_and_test_phase_1
  - build_and_test_phase_2
  - docker_build
  - deploy
  - cleanup
  - publish

variables:
  PYTEST_NUMBER_OF_PROCESSES: 8
  CTEST_NUMBER_OF_JOBS: 4
  # HAF_COMMIT is used as cache key - in HAF's own CI, it's the current commit
  HAF_COMMIT: $CI_COMMIT_SHA
  # Enable CI-specific PostgreSQL config with reduced memory (4GB shared_buffers vs 16GB)
  # This allows multiple concurrent HAF jobs on builders with limited RAM
  HAF_CI_MODE: "1"
  # Hive ref for fetching CI helper scripts at runtime (symlinks don't work without submodule checkout)
  # Should match the ref used in scripts/ci-helpers/prepare_data_image_job.yml include
  HIVE_SCRIPTS_REF: "3f8bf00eb992941b02be8fd18726476c9df143e5"

  # =============================================================================
  # Quick Test / Auto-Skip Mode
  # =============================================================================
  # Two ways to skip builds and use cached replay data:
  #
  # 1. AUTOMATIC (recommended): When only tests/docs/SQL change, builds are
  #    automatically skipped and cached data is used. No configuration needed.
  #
  # 2. MANUAL: Set QUICK_TEST=true to force skip mode with a specific cache:
  #    - QUICK_TEST=true
  #    - QUICK_TEST_HAF_COMMIT=<sha>  (required - find with list-haf-caches.sh)
  #    - QUICK_TEST_HAF_IMAGE=<image> (optional - defaults to :develop)
  #    - QUICK_TEST_JOBS=<jobs>       (optional - comma-separated extra jobs)
  #
  # Find available caches: ./scripts/ci-helpers/list-haf-caches.sh --recent
  #
  # 3. FORCE_BUILD: Set FORCE_BUILD=true to bypass ALL caching (skip, retag,
  #    sql_overlay) and force a full build + replay. Useful as a failsafe when
  #    cached images are broken or incompatible.
  # =============================================================================
  FORCE_BUILD: "false"
  QUICK_TEST: "false"
  QUICK_TEST_HAF_COMMIT: ""   # Required when QUICK_TEST=true
  QUICK_TEST_HAF_IMAGE: ""    # Optional - defaults to registry.gitlab.syncad.com/hive/haf:develop
  QUICK_TEST_JOBS: ""         # Optional - additional jobs to run (comma-separated)
  # Auto-populated by detect_changes job:
  AUTO_SKIP_BUILD: "false"    # Set to true when only non-SQL tests/docs changed
  AUTO_SKIP_REPLAY: "false"   # Set to true when only non-SQL tests/docs changed
  AUTO_CACHE_COMMIT: ""       # Most recent cached HAF commit

  # Set to "true" to run poetry update and test with latest dependency versions
  TEST_WITH_LATEST_DEPENDENCIES: "false"
  STATIC_ANALYSIS_WITH_LATEST_DEPENDENCIES: "false"

  # Fetch strategy reuses workspace between jobs, reducing GitLab server load.
  # Full clone (depth 0) enables efficient incremental fetches - shallow clones
  # don't reduce server CPU and make fetch less effective.
  GIT_STRATEGY: fetch
  GIT_DEPTH: 0
  GIT_SUBMODULE_DEPTH: 0
  # Disable automatic submodule fetching - we handle it manually in before_script
  # This is needed because the hive submodule is on a feature branch
  GIT_SUBMODULE_STRATEGY: none
  # Force HTTPS for submodule URLs (helps with nested submodules)
  GIT_SUBMODULE_FORCE_HTTPS: "true"
  # Allow file:// protocol for nested submodules
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: "protocol.file.allow"
  GIT_CONFIG_VALUE_0: "always"
  # Temporary: separate clone path prevents clone-strategy jobs from erasing
  # fetch workspaces during transition. Remove once all projects use fetch.
  GIT_CLONE_PATH: $CI_BUILDS_DIR/fetch/$CI_RUNNER_SHORT_TOKEN/$CI_CONCURRENT_ID/$CI_PROJECT_PATH

  FF_ENABLE_JOB_CLEANUP: 1
  FF_NETWORK_PER_BUILD: 1

  # Docker image tags from common-ci-configuration with util-linux for NFS flock support
  DOCKER_BUILDER_TAG: "3dd346380da7f28cdaf3ef3955559c905d94bd1c"
  DOCKER_DIND_TAG: "3dd346380da7f28cdaf3ef3955559c905d94bd1c"

  # Use Ubuntu-based ci-base-image with PostgreSQL 18 dev packages
  # Ubuntu variant needed because hived is built on Ubuntu 24.04 and replay jobs
  # run the binary directly on the ci-base-image (requires matching glibc)
  BUILDER_IMAGE_TAG: ":ubuntu24.04-pg18-1"
  HIVE_CI_BASE_IMAGE: "registry.gitlab.syncad.com/hive/common-ci-configuration/ci-base-image-ubuntu${BUILDER_IMAGE_TAG}"
  PYTHON_IMAGE: "registry.gitlab.syncad.com/hive/common-ci-configuration/ci-base-image-ubuntu${BUILDER_IMAGE_TAG}"
  CI_DEBUG_SERVICES: "true"
  SETUP_SCRIPTS_PATH: "$CI_PROJECT_DIR/scripts"
  TEST_TOOLS_NODE_DEFAULT_WAIT_FOR_LIVE_TIMEOUT: 60
  DATA_CACHE_HAF_PREFIX: "/cache/haf"
  # Local path for HAF data cache (fetched from NFS by cache-manager)
  HAF_DATA_CACHE_LOCAL: "/cache/haf_${HAF_COMMIT}"
  BLOCK_LOG_SOURCE_DIR_5M: /blockchain/block_log_5m
  # Mirrornet snapshot path on NFS for cross-builder access
  SNAPSHOTS_PATH: /nfs/ci-cache/haf/snapshots_pipeline_${CI_PIPELINE_ID}
  BLOCK_LOG_SOURCE_DIR_MIRRORNET_5M: /blockchain/block_log_5m_mirrornet

  # sccache distributed compiler cache (Redis backend on builder-10)
  SCCACHE_REDIS: "redis://192.168.50.109:6379"
  SCCACHE_CACHE_SIZE: "50G"

  # PostgreSQL access config for localhost-only jobs (IPv4 and IPv6)
  PG_ACCESS_LOCAL_TRUST: |
    local   all              all                            trust
    host    all              all        127.0.0.1/32        trust
    host    all              all        ::1/128             trust

include:
  - template: Workflows/Branch-Pipelines.gitlab-ci.yml
  - local: '/scripts/ci-helpers/prepare_data_image_job.yml'
  # Do not include common-ci-configuration here, it is already referenced by scripts/ci-helpers/prepare_data_image_job.yml included from Hive

# Use common git cleanup template from common-ci-configuration
# Includes: corrupt repo/submodule cleanup, directory-to-submodule transitions, permission fixes
default:
  hooks:
    pre_get_sources_script:
      - !reference [.haf_git_corruption_cleanup, hooks, pre_get_sources_script]
      - !reference [.haf_permission_fix, hooks, pre_get_sources_script]

# Reusable YAML anchors
.artifact_excludes: &artifact_excludes
  - "**/generated_during_*/**/block_log"
  - "**/generated_during_*/**/block_log.artifacts"
  - "**/generated_during_*/**/shared_memory.bin"
  - "**/generated_during_*/**/*.sst"

# Manual submodule initialization - needed because hive submodule is on a feature branch
# This version only clones test-related submodules (tests_api) - use for test jobs
.init_submodules:
  before_script: &init_submodules
    - |
      echo -e "\e[0Ksection_start:$(date +%s):init_submodules[collapsed=true]\r\e[0KInitializing submodules..."
      git config --global --add safe.directory '*'
      # Get the commit we need from the hive submodule
      HIVE_URL="https://gitlab.syncad.com/hive/hive.git"
      HIVE_COMMIT=$(git ls-tree HEAD hive | awk '{print $3}')
      echo "Need hive submodule at commit $HIVE_COMMIT"
      # Remove existing hive directory if it exists (can be stale from GIT_STRATEGY=fetch)
      # Use sudo to handle files created by different users in previous jobs
      sudo rm -rf hive 2>/dev/null || rm -rf hive
      # Clone and fetch from develop branch
      git clone --no-checkout "$HIVE_URL" hive
      cd hive
      git fetch origin develop
      git checkout $HIVE_COMMIT
      # Initialize only test-related submodules inside hive (skip rocksdb, zstd, fc, appbase, compression_dictionaries)
      git submodule update --init tests/python/hive-local-tools/tests_api
      cd ..
      # Update any remaining HAF submodules (currently none besides hive which is handled above)
      git submodule update --init
      echo -e "\e[0Ksection_end:$(date +%s):init_submodules\r\e[0K"

# Full submodule initialization - use for jobs that need to rebuild HAF (requires rocksdb, zstd, etc.)
.init_submodules_full:
  before_script: &init_submodules_full
    - |
      echo -e "\e[0Ksection_start:$(date +%s):init_submodules[collapsed=true]\r\e[0KInitializing submodules (full)..."
      git config --global --add safe.directory '*'
      # Get the commit we need from the hive submodule
      HIVE_URL="https://gitlab.syncad.com/hive/hive.git"
      HIVE_COMMIT=$(git ls-tree HEAD hive | awk '{print $3}')
      echo "Need hive submodule at commit $HIVE_COMMIT"
      # Remove existing hive directory if it exists (can be stale from GIT_STRATEGY=fetch)
      # Use sudo to handle files created by different users in previous jobs
      sudo rm -rf hive 2>/dev/null || rm -rf hive
      # Clone and fetch from develop branch
      git clone --no-checkout "$HIVE_URL" hive
      cd hive
      git fetch origin develop
      git checkout $HIVE_COMMIT
      # Initialize ALL submodules recursively (needed for rebuilding HAF)
      git submodule update --init --recursive
      cd ..
      # Update any remaining HAF submodules (currently none besides hive which is handled above)
      git submodule update --init
      echo -e "\e[0Ksection_end:$(date +%s):init_submodules\r\e[0K"

.fetch_haf_cache: &fetch_haf_cache
  # Get HAF data from NFS via cache-manager (commit-specific cache)
  - |
    echo -e "\e[0Ksection_start:$(date +%s):copy_data[collapsed=true]\r\e[0KFetching HAF data via cache-manager..."
    set -e
    # Fetch cache-manager from common-ci-configuration
    CACHE_MANAGER="/tmp/cache-manager.sh"
    curl -fsSL "https://gitlab.syncad.com/hive/common-ci-configuration/-/raw/develop/scripts/cache-manager.sh" -o "$CACHE_MANAGER"
    chmod +x "$CACHE_MANAGER"
    echo "Fetching cache: type=haf key=${HAF_COMMIT}"
    echo "Destination: ${HAF_DATA_CACHE_LOCAL}"

    # Clean up stale cache directory if it exists with permission issues
    # This prevents extraction failures when previous runs left bad state
    if [[ -d "${HAF_DATA_CACHE_LOCAL}" ]]; then
      if ! touch "${HAF_DATA_CACHE_LOCAL}/.write_test" 2>/dev/null; then
        echo "Stale cache with permission issues detected, cleaning up..."
        sudo rm -rf "${HAF_DATA_CACHE_LOCAL}" || rm -rf "${HAF_DATA_CACHE_LOCAL}" || true
      else
        rm -f "${HAF_DATA_CACHE_LOCAL}/.write_test"
      fi
    fi

    # cache-manager handles extraction and permission restoration
    "$CACHE_MANAGER" get "haf" "${HAF_COMMIT}" "${HAF_DATA_CACHE_LOCAL}"

    echo "HAF data fetch complete."
    ls -la "$HAF_DATA_CACHE_LOCAL/datadir/"
    echo -e "\e[0Ksection_end:$(date +%s):copy_data\r\e[0K"

verify_poetry_lock_sanity:
  extends: .verify_poetry_lock_sanity_template
  stage: build_and_test_phase_1
  variables:
    PYPROJECT_DIR: "$CI_PROJECT_DIR/tests/integration/haf-local-tools"
  before_script:
    - !reference [.init_submodules, before_script]
  tags:
    - public-runner-docker

verify_poetry_lock_stability:
  extends: .verify_poetry_lock_stability_template
  stage: build_and_test_phase_1
  variables:
    PYPROJECT_DIR: "$CI_PROJECT_DIR/tests/integration/haf-local-tools"
  tags:
    - public-runner-docker

# =============================================================================
# Change Detection & Quick Test Setup
# =============================================================================
# Detects if only tests/docs changed, finds cached replay data, and exports
# all necessary variables for downstream jobs:
#   AUTO_SKIP_BUILD  - true if build can be skipped
#   AUTO_SKIP_REPLAY - true if replay can be skipped
#   HAF_COMMIT       - commit SHA for cached data (when skipping)
#   HAF_IMAGE_NAME   - HAF image to use (when skipping build)
detect_changes:
  extends: .job-defaults
  stage: detect
  image: "$HIVE_CI_BASE_IMAGE"
  rules:
    # Skip for tags (always do full build for releases)
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success
  before_script: *init_submodules
  script:
    - |
      # Initialize defaults
      CAN_SKIP_BUILD=false
      CAN_SKIP_REPLAY=false
      CACHE_COMMIT=""
      HAF_IMG=""
      SQL_ONLY_CHANGE=false

      # FORCE_BUILD bypasses all caching and smart-build logic
      if [[ "${FORCE_BUILD:-}" == "true" ]]; then
        echo "=== FORCE_BUILD: Skipping all cache logic ==="
        echo "AUTO_SKIP_BUILD=false" >> detect_changes.env
        echo "AUTO_SKIP_REPLAY=false" >> detect_changes.env
        echo "SQL_ONLY_CHANGE=false" >> detect_changes.env
        echo "ANY_SQL_CHANGED=true" >> detect_changes.env
        echo "FORCE_BUILD=true" >> detect_changes.env
        echo ""
        echo "=== Summary ==="
        cat detect_changes.env
        exit 0

      # Handle manual QUICK_TEST mode
      elif [[ "$QUICK_TEST" == "true" ]]; then
        echo "=== Manual QUICK_TEST Mode ==="
        CAN_SKIP_BUILD=true
        CAN_SKIP_REPLAY=true
        CACHE_COMMIT="${QUICK_TEST_HAF_COMMIT}"
        if [[ -z "$CACHE_COMMIT" ]]; then
          echo "ERROR: QUICK_TEST_HAF_COMMIT must be set when QUICK_TEST=true"
          echo ""
          echo "Find available caches:"
          echo "  ./scripts/ci-helpers/list-haf-caches.sh --recent"
          exit 1
        fi
        # Use provided image or default to commit-specific tag
        CACHE_SHORT="${CACHE_COMMIT:0:8}"
        HAF_IMG="${QUICK_TEST_HAF_IMAGE:-registry.gitlab.syncad.com/hive/haf:$CACHE_SHORT}"
        echo "Using cached data from: $CACHE_COMMIT"
        echo "Using HAF image: $HAF_IMG"
      else
        # Automatic detection mode
        echo "=== Detecting Changed Files ==="

        # Get changed files based on pipeline type
        if [[ -n "${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}" ]]; then
          BASE_SHA="$CI_MERGE_REQUEST_DIFF_BASE_SHA"
          echo "MR pipeline: comparing against target branch"
        elif [[ "${CI_PIPELINE_SOURCE:-}" == "push" ]]; then
          BASE_SHA="${CI_COMMIT_BEFORE_SHA:-HEAD~1}"
          echo "Push pipeline: comparing against pre-push state ($BASE_SHA)"
        else
          BASE_SHA=$(git merge-base HEAD origin/develop 2>/dev/null || echo "HEAD~1")
          echo "Other pipeline: comparing against develop"
        fi

        echo "Comparing $BASE_SHA to HEAD"
        CHANGED_FILES=$(git diff --name-only "$BASE_SHA" HEAD 2>/dev/null || git diff --name-only HEAD~1 HEAD)

        echo "Changed files:"
        echo "$CHANGED_FILES" | head -50

        # Three levels of change detection:
        # 1. Skip BUILD completely: only tests/docs changed (no SQL, no source)
        # 2. SQL-only change: SQL changed but no C++ source - use thin overlay build
        # 3. Full build: C++ source changed - requires full compilation

        # Note: Avoid \.txt$ as it matches CMakeLists.txt
        # Patterns for files that don't require any build (test .sql files excluded
        # since they're executed by hfm_functional_tests and must trigger a run)
        SKIP_ALL_PATTERNS="^docs/|\.md$|^README|^CHANGELOG|^LICENSE"
        SKIP_TEST_PATTERNS="^tests/.*\.(py|sh|cfg|ini|json|yaml|yml)$"
        # SQL files need thin overlay build but not full C++ compilation
        SQL_PATTERNS="\.sql$"

        # Check what files changed
        NON_SKIP_FILES=$(echo "$CHANGED_FILES" | grep -vE "$SKIP_ALL_PATTERNS" | grep -vE "$SKIP_TEST_PATTERNS" || true)
        SQL_CHANGED=$(echo "$NON_SKIP_FILES" | grep -E "$SQL_PATTERNS" || true)
        # Track if ANY .sql file changed (including under tests/) for hfm_functional_tests
        ANY_SQL_CHANGED=$(echo "$CHANGED_FILES" | grep -E "$SQL_PATTERNS" || true)
        NON_SQL_SOURCE=$(echo "$NON_SKIP_FILES" | grep -vE "$SQL_PATTERNS" || true)

        # Determine build mode
        SQL_ONLY_CHANGE=false
        if [[ -z "$NON_SKIP_FILES" ]]; then
          # Only tests/docs changed - can skip build entirely
          CAN_SKIP_BUILD=true
          CAN_SKIP_REPLAY=true
          echo ""
          echo "=== Can skip build entirely (only tests/docs changed) ==="
        elif [[ -z "$NON_SQL_SOURCE" && -n "$SQL_CHANGED" ]]; then
          # Only SQL files changed (plus maybe tests/docs) - use thin overlay
          SQL_ONLY_CHANGE=true
          echo ""
          echo "=== SQL-only change detected - will use thin overlay build ==="
          echo "SQL files changed:"
          echo "$SQL_CHANGED" | head -10
        else
          echo ""
          echo "=== Full build required (C++ source changed) ==="
          echo "Source files requiring build:"
          echo "$NON_SQL_SOURCE" | head -20
        fi

        # Find cached data/images when we can skip something
        # Docker login for image verification
        echo "$CI_JOB_TOKEN" | docker login -u gitlab-ci-token --password-stdin "$CI_REGISTRY" 2>/dev/null || true

        NFS_CACHE_PATH="/nfs/ci-cache/haf"
        if [[ -d "$NFS_CACHE_PATH" ]]; then
          # Look through recent cache files to find one with valid Docker images
          for TAR in $(ls -t "$NFS_CACHE_PATH"/*.tar 2>/dev/null | head -5); do
            TEST_COMMIT=$(basename "$TAR" .tar)
            CACHE_SHORT="${TEST_COMMIT:0:8}"

            # Verify Docker images exist for all network types
            IMAGES_EXIST=true
            for NETWORK in "" "/testnet" "/mirrornet"; do
              IMG="registry.gitlab.syncad.com/hive/haf${NETWORK}:${CACHE_SHORT}"
              if ! docker manifest inspect "$IMG" >/dev/null 2>&1; then
                echo "Image not found: $IMG"
                IMAGES_EXIST=false
                break
              fi
            done

            if [[ "$IMAGES_EXIST" == "true" ]]; then
              # Verify cache commit is reachable from current branch to avoid schema mismatches
              # This prevents using caches from feature branches with incompatible schema changes
              if ! git merge-base --is-ancestor "$TEST_COMMIT" HEAD 2>/dev/null; then
                echo "Cache $TEST_COMMIT not ancestor of HEAD - skipping (incompatible branch)"
                continue
              fi
              CACHE_COMMIT="$TEST_COMMIT"
              echo "Found cached data with valid images: $CACHE_COMMIT"
              break
            else
              echo "Cache $TEST_COMMIT missing Docker images, trying next..."
            fi
          done
        fi

        # For complete skip, we need cached data with images
        if [[ "$CAN_SKIP_BUILD" == "true" ]] && [[ -z "$CACHE_COMMIT" ]]; then
          echo "WARNING: No cached data with valid images found - cannot skip build"
          CAN_SKIP_BUILD=false
        fi

        # For SQL-only change, we need a base image to overlay on
        if [[ "$SQL_ONLY_CHANGE" == "true" ]] && [[ -z "$CACHE_COMMIT" ]]; then
          echo "WARNING: No cached image found for thin overlay - falling back to full build"
          SQL_ONLY_CHANGE=false
        fi

        if [[ "$CAN_SKIP_REPLAY" == "true" ]] && [[ -z "$CACHE_COMMIT" ]]; then
          echo "WARNING: No cached data found - cannot skip replay"
          CAN_SKIP_REPLAY=false
        fi
      fi

      # Export results
      echo "AUTO_SKIP_BUILD=$CAN_SKIP_BUILD" >> detect_changes.env
      echo "AUTO_SKIP_REPLAY=$CAN_SKIP_REPLAY" >> detect_changes.env
      echo "SQL_ONLY_CHANGE=$SQL_ONLY_CHANGE" >> detect_changes.env
      if [[ -n "$ANY_SQL_CHANGED" ]]; then
        echo "ANY_SQL_CHANGED=true" >> detect_changes.env
      else
        echo "ANY_SQL_CHANGED=false" >> detect_changes.env
      fi

      # Export HAF_COMMIT and cached image info when we can use cached data
      if [[ "$CAN_SKIP_BUILD" == "true" || "$SQL_ONLY_CHANGE" == "true" ]]; then
        echo "AUTO_CACHE_COMMIT=$CACHE_COMMIT" >> detect_changes.env
        # Use image tag based on cache commit (first 8 chars)
        CACHE_SHORT="${CACHE_COMMIT:0:8}"
        HAF_IMG="${QUICK_TEST_HAF_IMAGE:-registry.gitlab.syncad.com/hive/haf:$CACHE_SHORT}"
        echo "CACHED_BASE_IMAGE=$HAF_IMG" >> detect_changes.env
        # HAF_COMMIT must point to cache commit for data cache paths (HAF_DATA_CACHE_LOCAL)
        echo "HAF_COMMIT=$CACHE_COMMIT" >> detect_changes.env
      fi

      # For complete build skip, also export HAF_IMAGE_NAME (uses cached image directly)
      if [[ "$CAN_SKIP_BUILD" == "true" ]]; then
        echo "HAF_IMAGE_NAME=$HAF_IMG" >> detect_changes.env
      fi

      echo ""
      echo "=== Summary ==="
      cat detect_changes.env
  artifacts:
    reports:
      dotenv: detect_changes.env
    expire_in: 1 day
  tags:
    - public-runner-docker
    - data-cache-storage  # Needs NFS access to find caches

.haf_image_build:
  extends: .prepare_haf_image
  stage: build_and_test_phase_1
  variables:
    # Build jobs need ALL submodules (including rocksdb, zstd) for compilation
    # Override the global 'none' strategy with 'recursive' for builds
    GIT_SUBMODULE_STRATEGY: recursive
    # Smart image build thresholds - re-tag when gap > 20, rebuild when > 25
    RETAG_THRESHOLD: "20"
    SEARCH_DEPTH: "25"
    # Source patterns loaded dynamically from source-patterns.sh in before_script
    SOURCE_PATTERNS: ""
  needs:
    - job: detect_changes
      artifacts: true
      optional: true  # Optional for tagged builds where detect_changes is skipped
  before_script:
    # Set up docker-container buildx builder (required for registry caching)
    # This is needed because the default docker driver doesn't support cache export
    - !reference [.docker_image_builder_job_template, before_script]
    # Fix git safe.directory issue on some runners (CVE-2022-24765)
    - git config --global --add safe.directory '*'
    # Load source patterns from the single source of truth
    - |
      SOURCE_PATTERNS=$("${CI_PROJECT_DIR}/scripts/ci-helpers/source-patterns.sh")
      echo "Loaded SOURCE_PATTERNS: $SOURCE_PATTERNS"
      export SOURCE_PATTERNS
    # Fetch required scripts from hive repo (symlinks don't work without submodule checkout)
    - |
      HIVE_RAW_URL="https://gitlab.syncad.com/hive/hive/-/raw/${HIVE_SCRIPTS_REF}/scripts/ci-helpers"
      SCRIPTS_PATH="${CI_PROJECT_DIR}/scripts"
      for script in export-data-from-docker-image.sh; do
        TARGET="$SCRIPTS_PATH/ci-helpers/$script"
        # Remove dangling symlink before fetching
        rm -f "$TARGET"
        echo "Fetching $script from hive@${HIVE_SCRIPTS_REF}..."
        curl -fsSL "${HIVE_RAW_URL}/${script}" -o "$TARGET"
        chmod +x "$TARGET"
      done
    # Fetch smart-image-build.sh from common-ci-configuration
    - |
      COMMON_CI_URL="https://gitlab.syncad.com/hive/common-ci-configuration/-/raw/develop/scripts/bash"
      echo "Fetching smart-image-build.sh from common-ci-configuration..."
      curl -fsSL "${COMMON_CI_URL}/smart-image-build.sh" -o /tmp/smart-image-build.sh
      chmod +x /tmp/smart-image-build.sh
    # Determine build action using smart-image-build.sh
    # This handles: build (full), retag (re-tag cached image), skip (use cached as-is)
    - |
      echo -e "\e[0Ksection_start:$(date +%s):smart_build[collapsed=true]\r\e[0KDetermining build action..."

      # Determine build mode and get cached commit
      SKIP_BUILD_ALLOWED=false
      SQL_OVERLAY_BUILD=false
      CACHED_COMMIT=""
      CACHED_IMAGE=""

      # Check for manual QUICK_TEST mode
      if [[ "${QUICK_TEST:-false}" == "true" ]]; then
        SKIP_BUILD_ALLOWED=true
        CACHED_COMMIT="${QUICK_TEST_HAF_COMMIT}"
        if [[ -z "$CACHED_COMMIT" ]]; then
          echo "ERROR: QUICK_TEST=true but QUICK_TEST_HAF_COMMIT not set"
          exit 1
        fi
        # Validate that the cache file actually exists
        CACHE_FILE="/nfs/ci-cache/haf/${CACHED_COMMIT}.tar"
        if [[ ! -f "$CACHE_FILE" ]]; then
          echo "ERROR: Cache file not found for QUICK_TEST_HAF_COMMIT=$CACHED_COMMIT"
          echo "Expected: $CACHE_FILE"
          echo "Find available caches: ssh hive-builder-10 'ls -lt /nfs/ci-cache/haf/*.tar | head -5'"
          exit 1
        fi
      # Check for automatic skip mode (from detect_changes)
      elif [[ "${AUTO_SKIP_BUILD:-false}" == "true" ]]; then
        SKIP_BUILD_ALLOWED=true
        CACHED_COMMIT="${HAF_COMMIT}"
      # Check for SQL-only change mode (from detect_changes)
      elif [[ "${SQL_ONLY_CHANGE:-false}" == "true" ]]; then
        SQL_OVERLAY_BUILD=true
        CACHED_COMMIT="${AUTO_CACHE_COMMIT}"
        echo "SQL-only change detected - will build thin overlay"
      fi

      # Build cached image name if we have a cached commit
      if [[ -n "$CACHED_COMMIT" ]]; then
        CACHE_SHORT="${CACHED_COMMIT:0:8}"
        # Allow PG_IMAGE_SUBPATH to override the network-derived subpath
        if [[ -n "${PG_IMAGE_SUBPATH:-}" ]]; then
          CACHED_IMAGE="registry.gitlab.syncad.com/hive/haf/${PG_IMAGE_SUBPATH}:${CACHE_SHORT}"
          IMAGE_SUBPATH="${PG_IMAGE_SUBPATH}"
        else
          case "${HIVE_NETWORK_TYPE:-mainnet}" in
            testnet)
              CACHED_IMAGE="registry.gitlab.syncad.com/hive/haf/testnet:${CACHE_SHORT}"
              IMAGE_SUBPATH="testnet"
              ;;
            mirrornet)
              CACHED_IMAGE="registry.gitlab.syncad.com/hive/haf/mirrornet:${CACHE_SHORT}"
              IMAGE_SUBPATH="mirrornet"
              ;;
            *)
              CACHED_IMAGE="registry.gitlab.syncad.com/hive/haf:${CACHE_SHORT}"
              IMAGE_SUBPATH=""
              ;;
          esac
        fi
      fi

      # Ensure IMAGE_SUBPATH is set from PG_IMAGE_SUBPATH even without cached commit
      if [[ -n "${PG_IMAGE_SUBPATH:-}" ]] && [[ -z "${IMAGE_SUBPATH:-}" ]]; then
        IMAGE_SUBPATH="${PG_IMAGE_SUBPATH}"
      fi

      # Build smart-image-build arguments
      BUILD_ARGS=(
        --registry="registry.gitlab.syncad.com/hive/haf"
        --patterns="${SOURCE_PATTERNS}"
        --commit="${CI_COMMIT_SHA}"
        --retag-threshold="${RETAG_THRESHOLD}"
        --search-depth="${SEARCH_DEPTH}"
        --verify-image
        --output=smart_build_decision.env
      )

      # Add image subpath for testnet/mirrornet
      if [[ -n "${IMAGE_SUBPATH:-}" ]]; then
        BUILD_ARGS+=(--image="${IMAGE_SUBPATH}")
      fi

      # Add skip-build info if we can skip
      if [[ "$SKIP_BUILD_ALLOWED" == "true" && -n "$CACHED_COMMIT" && -n "$CACHED_IMAGE" ]]; then
        BUILD_ARGS+=(
          --skip-build
          --cached-commit="${CACHED_COMMIT}"
          --cached-image="${CACHED_IMAGE}"
        )
      fi

      # Run smart-image-build to determine action
      /tmp/smart-image-build.sh "${BUILD_ARGS[@]}"
      source smart_build_decision.env

      # FORCE_BUILD overrides smart-build decision to always do full build
      if [[ "${FORCE_BUILD:-}" == "true" ]]; then
        BUILD_ACTION="build"
        echo "FORCE_BUILD: Overriding BUILD_ACTION to 'build'"
      fi

      # Override BUILD_ACTION if SQL-only change detected
      if [[ "$SQL_OVERLAY_BUILD" == "true" && -n "$CACHED_COMMIT" && -n "$CACHED_IMAGE" ]]; then
        BUILD_ACTION="sql_overlay"
        CACHED_IMAGE_NAME="$CACHED_IMAGE"
        echo "BUILD_ACTION=sql_overlay" >> smart_build_decision.env
        echo "CACHED_IMAGE_NAME=$CACHED_IMAGE" >> smart_build_decision.env
      fi

      echo ""
      echo "Build decision: BUILD_ACTION=${BUILD_ACTION}"
      echo -e "\e[0Ksection_end:$(date +%s):smart_build\r\e[0K"

      # Export for use in later script blocks (avoid IMAGE_NAME - conflicts with other scripts)
      export BUILD_ACTION CACHED_IMAGE_NAME IMAGE_COMMIT SQL_OVERLAY_BUILD
    # Handle skip and retag cases - exit early if not building
    - |
      source smart_build_decision.env

      case "$BUILD_ACTION" in
        skip)
          echo "=== Using cached image (no re-tag needed) ==="
          echo "Cached image: ${CACHED_IMAGE_NAME}"
          # Create dotenv artifact with cached image name
          echo "HAF_IMAGE_NAME=${CACHED_IMAGE_NAME}" > docker_image_name.env
          echo "HAF_INSTANCE=${CACHED_IMAGE_NAME}" >> docker_image_name.env
          echo "BUILD_ACTION=skip" >> docker_image_name.env
          # Extract binaries from cached Docker image (downstream jobs need them)
          echo "Extracting binaries from cached image..."
          SCRIPTS_PATH="${CI_PROJECT_DIR}/scripts"
          "$SCRIPTS_PATH/ci-helpers/export-data-from-docker-image.sh" "${CACHED_IMAGE_NAME}" "${BINARY_CACHE_PATH:-$CI_PROJECT_DIR/haf-binaries}"
          chmod -Rc a+rwx "${BINARY_CACHE_PATH:-$CI_PROJECT_DIR/haf-binaries}"
          ls -la "${BINARY_CACHE_PATH:-$CI_PROJECT_DIR/haf-binaries}/"
          echo "Build skipped - binaries extracted from cached image"
          exit 0
          ;;
        retag)
          # Get target image name from env file (use local var to avoid conflicts)
          TARGET_IMAGE="${IMAGE_NAME}"
          echo "=== Re-tagging cached image to current commit ==="
          echo "Source: ${CACHED_IMAGE_NAME}"
          echo "Target: ${TARGET_IMAGE}"

          # Login to registry
          echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

          # Pull, tag, and push
          docker pull "${CACHED_IMAGE_NAME}"
          docker tag "${CACHED_IMAGE_NAME}" "${TARGET_IMAGE}"
          docker push "${TARGET_IMAGE}"

          # Create dotenv artifact with new image name
          echo "HAF_IMAGE_NAME=${TARGET_IMAGE}" > docker_image_name.env
          echo "HAF_INSTANCE=${TARGET_IMAGE}" >> docker_image_name.env
          echo "BUILD_ACTION=retag" >> docker_image_name.env
          # Extract binaries from the image (downstream jobs need them)
          echo "Extracting binaries from re-tagged image..."
          SCRIPTS_PATH="${CI_PROJECT_DIR}/scripts"
          "$SCRIPTS_PATH/ci-helpers/export-data-from-docker-image.sh" "${TARGET_IMAGE}" "${BINARY_CACHE_PATH:-$CI_PROJECT_DIR/haf-binaries}"
          chmod -Rc a+rwx "${BINARY_CACHE_PATH:-$CI_PROJECT_DIR/haf-binaries}"
          ls -la "${BINARY_CACHE_PATH:-$CI_PROJECT_DIR/haf-binaries}/"
          echo "Image re-tagged and binaries extracted"
          exit 0
          ;;
        sql_overlay)
          # Thin overlay build for SQL-only changes
          # This is fast (~30 seconds) because it only updates extension SQL files
          echo "=== Building thin SQL overlay ==="
          echo "Base image: ${CACHED_IMAGE_NAME}"

          # Determine target image name (current commit)
          COMMIT_SHORT="${CI_COMMIT_SHORT_SHA}"
          if [[ -n "${PG_IMAGE_SUBPATH:-}" ]]; then
            TARGET_IMAGE="registry.gitlab.syncad.com/hive/haf/${PG_IMAGE_SUBPATH}:${COMMIT_SHORT}"
          else
            case "${HIVE_NETWORK_TYPE:-mainnet}" in
              testnet)
                TARGET_IMAGE="registry.gitlab.syncad.com/hive/haf/testnet:${COMMIT_SHORT}"
                ;;
              mirrornet)
                TARGET_IMAGE="registry.gitlab.syncad.com/hive/haf/mirrornet:${COMMIT_SHORT}"
                ;;
              *)
                TARGET_IMAGE="registry.gitlab.syncad.com/hive/haf:${COMMIT_SHORT}"
                ;;
            esac
          fi
          echo "Target image: ${TARGET_IMAGE}"

          # Detect PG version from base image (inherited ENV)
          # Pull + inspect is much faster than docker run (avoids starting a container)
          echo "Detecting PostgreSQL version from base image..."
          docker pull "${CACHED_IMAGE_NAME}" >/dev/null 2>&1 || true
          BASE_PG_VERSION=$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "${CACHED_IMAGE_NAME}" 2>/dev/null | grep '^POSTGRES_VERSION=' | cut -d= -f2)
          BASE_PG_VERSION="${BASE_PG_VERSION:-17}"
          echo "Base image PostgreSQL version: ${BASE_PG_VERSION}"

          # Generate extension SQL files using the local script
          echo "Generating extension SQL files..."
          SCRIPTS_PATH="${CI_PROJECT_DIR}/scripts"
          mkdir -p "${CI_PROJECT_DIR}/extension_sql"
          "${SCRIPTS_PATH}/generate_extension_sql.sh" "${CI_COMMIT_SHA}" "${CI_PROJECT_DIR}/extension_sql" "${BASE_PG_VERSION}"

          # Login to registry
          echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

          # Build thin overlay using Dockerfile.sql-overlay
          # CACHED_COMMIT contains the base image's commit (needed for .so symlink)
          # POSTGRES_VERSION is inherited from base image ENV — no build-arg needed
          echo "Building thin overlay Docker image..."
          docker build \
            -f "${CI_PROJECT_DIR}/Dockerfile.sql-overlay" \
            --build-arg BASE_IMAGE="${CACHED_IMAGE_NAME}" \
            --build-arg GIT_SHA="${CI_COMMIT_SHA}" \
            --build-arg BASE_COMMIT="${CACHED_COMMIT}" \
            -t "${TARGET_IMAGE}" \
            "${CI_PROJECT_DIR}"

          # Push the new image
          docker push "${TARGET_IMAGE}"

          # Create dotenv artifact with new image name
          echo "HAF_IMAGE_NAME=${TARGET_IMAGE}" > docker_image_name.env
          echo "HAF_INSTANCE=${TARGET_IMAGE}" >> docker_image_name.env
          echo "BUILD_ACTION=sql_overlay" >> docker_image_name.env

          # Extract binaries from the base image (they're unchanged, but downstream jobs need them)
          echo "Extracting binaries from base image..."
          "$SCRIPTS_PATH/ci-helpers/export-data-from-docker-image.sh" "${CACHED_IMAGE_NAME}" "${BINARY_CACHE_PATH:-$CI_PROJECT_DIR/haf-binaries}"
          chmod -Rc a+rwx "${BINARY_CACHE_PATH:-$CI_PROJECT_DIR/haf-binaries}"
          ls -la "${BINARY_CACHE_PATH:-$CI_PROJECT_DIR/haf-binaries}/"

          echo "SQL overlay build complete"
          exit 0
          ;;
        build)
          echo "=== Full build required ==="
          # Continue to submodule init and actual build
          ;;
        *)
          echo "ERROR: Unknown BUILD_ACTION: $BUILD_ACTION"
          exit 1
          ;;
      esac
    # Initialize submodules for fresh build (required for nested submodules like rocksdb)
    # Uses full submodule init since builds need rocksdb, zstd, fc, etc.
    - !reference [.init_submodules_full, before_script]
  tags:
    - public-runner-docker

haf_image_build:
  extends: .haf_image_build
  variables:
    BINARY_CACHE_PATH: "$CI_PROJECT_DIR/haf-binaries"
    HIVE_NETWORK_TYPE: mainnet
    POSTGRES_VERSION: "17"
  tags:
    - bigjob
  after_script:
    - |
      source docker_image_name.env
      echo "Adding latest/stable/version tags for mainnet image..."
      # Pull image to local daemon (may not be loaded when using cached builds)
      # timeout prevents hangs when Docker daemon is overloaded
      timeout 300 docker pull $HAF_INSTANCE || echo "Warning: docker pull failed or timed out"
      docker images
      if [[ "$CI_COMMIT_BRANCH" == "develop" ]]; then
        docker tag $HAF_INSTANCE ${CI_REGISTRY_IMAGE}:latest
        docker push ${CI_REGISTRY_IMAGE}:latest
      elif [[ "$CI_COMMIT_BRANCH" == "master" ]]; then
        docker tag $HAF_INSTANCE ${CI_REGISTRY_IMAGE}:stable
        docker push ${CI_REGISTRY_IMAGE}:stable
      fi
      if [[ -n "$CI_COMMIT_TAG" && "$CI_COMMIT_REF_PROTECTED" == "true" ]]; then
        docker tag $HAF_INSTANCE ${CI_REGISTRY_IMAGE}:${CI_COMMIT_TAG}
        docker push ${CI_REGISTRY_IMAGE}:${CI_COMMIT_TAG}
      fi

