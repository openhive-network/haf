      artifacts: true
      optional: true  # Skipped in QUICK_TEST/AUTO_SKIP mode
    - job: detect_changes
      artifacts: true
      optional: true  # Skipped for tagged builds
  stage: build_and_test_phase_1
  timeout: 80m
  variables:
    HIVE_NETWORK_TYPE: mainnet
    BLOCK_LOG_SOURCE_DIR: "$BLOCK_LOG_SOURCE_DIR_5M"
    CONFIG_INI_SOURCE: "$CI_PROJECT_DIR/docker/config_5M.ini"
  tags:
    - data-cache-storage
    - fast

# Creates a temporary copy of replay data for the exclusive use of current pipeline
replay_data_copy:
  extends: .job-defaults
  image: "${CI_REGISTRY_IMAGE}/ci-base-image${BUILDER_IMAGE_TAG}"
  stage: build_and_test_phase_1
  needs:
    - prepare_haf_data
    - job: haf_image_build
      optional: true  # Skipped in QUICK_TEST/AUTO_SKIP mode
    - job: detect_changes
      artifacts: true
      optional: true  # Skipped for tagged builds
  variables:
    SCRIPTS_PATH: "$CI_PROJECT_DIR/scripts"
  script:
    - |
      set -e
      CACHE_MANAGER="$SCRIPTS_PATH/ci-helpers/cache-manager.sh"
      SOURCE_CACHE="${DATA_CACHE_HAF_PREFIX:?}_${HAF_COMMIT:?}"

      echo "Creating pipeline cache via cache-manager"

      # Find source data - local cache or fetch from NFS
      if [[ -d "$SOURCE_CACHE" ]]; then
        echo "Using local cache: $SOURCE_CACHE"
        DATA_SOURCE="$SOURCE_CACHE"
      elif [[ -x "$CACHE_MANAGER" ]]; then
        echo "Local cache not found, fetching from NFS..."
        LOCAL_CACHE="/cache/haf_${HAF_COMMIT:?}"
        if "$CACHE_MANAGER" get haf "${HAF_COMMIT:?}" "$LOCAL_CACHE"; then
          DATA_SOURCE="$LOCAL_CACHE"
        else
          echo "ERROR: Failed to get cache for HAF commit ${HAF_COMMIT:?}"
          exit 1
        fi
      else
        echo "ERROR: No local cache and cache-manager not available"
        exit 1
      fi

      # Store pipeline data via cache-manager (creates tar on NFS)
      echo "Storing pipeline cache: type=${PIPELINE_CACHE_TYPE} key=${PIPELINE_CACHE_KEY}"
      "$CACHE_MANAGER" put "${PIPELINE_CACHE_TYPE}" "${PIPELINE_CACHE_KEY}" "$DATA_SOURCE"
      echo "Pipeline cache stored successfully"
  tags:
    - data-cache-storage
    - fast

