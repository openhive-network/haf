start_haf_as_service:
  extends: .job-defaults
  stage: build_and_test_phase_2
  image: "$HIVE_CI_BASE_IMAGE"
  needs:
    - job: prepare_haf_data
      artifacts: true
    - job: haf_image_build
      artifacts: true
      optional: true  # Skipped in QUICK_TEST/AUTO_SKIP mode
    - job: detect_changes
      artifacts: true
      optional: true  # Skipped for tagged builds
  services:
    - *haf-service
  variables:
    HAF_POSTGRES_URL: postgresql://haf_admin@haf-instance:5432/haf_block_log
    HAF_COMMIT: $HAF_COMMIT
  # Note: No before_script/fetch_haf_cache needed - service container already extracts to ${HAF_DATA_CACHE_LOCAL}
  script:
    # Wait for hived API to be ready (adapted from block_api_tests pattern)
    - |
      echo -e "\e[0Ksection_start:$(date +%s):wait_hived[collapsed=true]\r\e[0KWaiting for hived API..."
      python3 -c "
      import socket
      import time
      host = 'haf-instance'
      port = 8091
      for i in range(120):
          try:
              s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
              s.settimeout(2)
              s.connect((host, port))
              s.close()
              print(f'hived API ready after {i+1} attempts')
              exit(0)
          except (socket.error, socket.timeout):
              print(f'Waiting for hived API... attempt {i+1}/120')
              time.sleep(5)
      print('ERROR: hived API not ready after 120 attempts')
      exit(1)
      "
      echo -e "\e[0Ksection_end:$(date +%s):wait_hived\r\e[0K"
    - curl -I haf-instance:8091 || (echo "error connecting to service hived-instance" && false)
    - |
        curl -XPOST -d '{
        "jsonrpc": "2.0",
        "method": "database_api.get_dynamic_global_properties",
        "params": {
        },
        "id": 2
        }' haf-instance:8091
  after_script:
    - rm docker_entrypoint.log -f
    - cp "${HAF_DATA_CACHE_LOCAL}/datadir/$CI_JOB_NAME.log" "$CI_PROJECT_DIR/docker_entrypoint.log"
  artifacts:
    paths:
    - docker_entrypoint.log
  tags:
    - public-runner-docker
    - data-cache-storage
    - fast

cleanup_haf_cache_manual:
  extends: .cleanup_cache_manual_template
  stage: cleanup
  variables:
    CLEANUP_PATH_PATTERN: "/cache/replay_data_haf_*"
  tags:
    - public-runner-docker
    - data-cache-storage
    - fast

cleanup_haf_snapshot_from_cache:
  extends: .cleanup_cache_manual_template
  stage: cleanup
  variables:
    CLEANUP_PATH_PATTERN: "/cache/snapshots_pipeline_*"
  tags:
    - public-runner-docker
    - data-cache-storage
    - fast

cleanup_old_haf_cache:
  extends: .cleanup_old_cache_template
  stage: cleanup
  variables:
    CLEANUP_PATH_PATTERN: "/cache/replay_data_haf_*"
  tags:
    - public-runner-docker
    - data-cache-storage
    - fast

publish_images:
  extends: .docker_publish_job_template
  variables:
    # Publish mainnet (root) and mirrornet images to registry.hive.blog
    # Note: testnet is not published externally (internal use only)
    PUBLISH_IMAGES: "haf mirrornet"

double_haf_replay_tests:
  extends: .docker_image_builder_job
  stage: build_and_test_phase_2
  variables:
    CONFIG_INI_SOURCE: "$CI_PROJECT_DIR/docker/config_5M.ini"
  needs:
    - job: haf_image_build
      artifacts: true
  script:
  - docker container ps -a
  - docker images
  - docker context ls
  tags:
    - public-runner-docker

op_body_filter_tests:
  extends: .job-defaults
  stage: build_and_test_phase_2
  needs:
    - job: haf_image_build_testnet
      artifacts: true
  image:
    name: $HAF_IMAGE_NAME
    entrypoint: [""]
  # No submodule initialization needed - this test only uses the op_body_filter binary
  # and pytest with no external dependencies (test_tools dependency removed)
  script:
    - /home/hived/docker_entrypoint.sh --execute-maintenance-script=$CI_PROJECT_DIR/scripts/maintenance-scripts/run_op_body_filter_tests.sh
  artifacts:
    paths:
    - "op_body_filter_tests.log"
    - "**/generated_during_*"
    - "**/generated_by_package_fixtures"
    exclude: *artifact_excludes
    reports:
      junit: tests/integration/tools/op_body_filter/report.xml
    when: always
    expire_in: 1 week
  interruptible: true
  tags:
    - public-runner-docker

