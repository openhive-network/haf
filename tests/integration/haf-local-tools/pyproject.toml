[build-system]
requires = ["poetry-core>=1.7.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "haf_local_tools"
version = "0.0.0"
description = "A collective library containing all the tools required by haf python tests."
authors = [{ name = "Mateusz Żebrak", email = "mzebrak@syncad.com" }]
requires-python = ">=3.14,<4"
dependencies = [
    "pandas>=2.2.3,<3.0.0",
    "psycopg2-binary>=2.9.11,<3.0.0",
    "msgspec>=0.20.0,<1.0.0",
    "sqlalchemy>=2.0.39,<3.0.0",
    "sqlalchemy-utils>=0.41.2",
    "hive_local_tools",
]

[tool.poetry]
requires-poetry = "2.1.3"
packages = [
    { include = "haf_local_tools" },
]
source = [
    { name = "PyPI", priority = "primary" },
    { name = "gitlab-hive", url = "https://gitlab.syncad.com/api/v4/projects/198/packages/pypi/simple", priority = "supplemental" },
    { name = "gitlab-schemas", url = "https://gitlab.syncad.com/api/v4/projects/362/packages/pypi/simple", priority = "supplemental" },
    { name = "gitlab-wax", url = "https://gitlab.syncad.com/api/v4/projects/419/packages/pypi/simple", priority = "supplemental" },
    { name = "gitlab-helpy", url = "https://gitlab.syncad.com/api/v4/projects/434/packages/pypi/simple", priority = "supplemental" },
    { name = "gitlab-test-tools", url = "https://gitlab.syncad.com/api/v4/projects/300/packages/pypi/simple", priority = "supplemental" },
]

[tool.poetry.dependencies]
hive_local_tools = { path = "../../../hive/tests/python/hive-local-tools", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3.5"
pytest-asyncio = ">=0.25.3"

[tool.poetry.group.static-analysis.dependencies]
mypy = ">=1.19.1"
ruff = ">=0.14.10"
pre-commit = ">=4.5.1"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D1", "D203", "D212", "D413", "COM812", "ISC001", "S101"]

[tool.ruff.lint.isort]
known-first-party = ["haf_local_tools"]
required-imports = ["from __future__ import annotations"]

[tool.mypy]
strict = true
python_version = 3.14

[[tool.mypy.overrides]]
module = ["test_tools.*", "hive_local_tools.*"]
ignore_missing_imports = true
